          - { ui: "Lab Range Start", api: labRangeValueStart }
          - { ui: "Lab Range End", api: labRangeValueEnd }
          - { ui: "Unit Value", api: unitsValue }
          - { ui: "Findings", api: findings }

      - ui_key: hbsag
        api_key: hbsag
        cardinality: { ui: "1:1 (single value)", api: "1:1 (V4 sends the result at the root; no parameters[])" }
        status: correlated
        shape: single_value
        # V4: the result is at the section root (value "non_reactive", findings), and parameters[] is gone.
        #   The earlier conflict (result in parameters[0], root value null) is resolved.
        result_fields:
          - { ui: "Value", api: value, status: correlated }
          - { ui: "Findings", api: findings }
        # API TEAM:
        #   - Value "non_reactive" and findings "NEGATIVE/NON REACTIVE" are coded values. The master API owns the
        #     code list and the UI loads its options from the same master (request 14); until then they show empty.

      - ui_key: hiv_elisa
        api_key: hiv_elisa
        cardinality: { ui: "1:1 (single value)", api: "1:1" }
        status: correlated
        shape: single_value
        result_fields:
