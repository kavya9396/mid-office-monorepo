<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ICICI Life | View Medical</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px Arial, Helvetica, sans-serif;
            color: #344054;
            background: #fff
        }

        button,
        input,
        select {
            font: inherit
        }

        .header {
            height: 57px;
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            background: linear-gradient(to bottom, #F58220, #E65318 42%, #C92E27 72%, #98252B);
            box-shadow: 0 3px 12px rgba(111, 24, 24, .25)
        }

        .header-back {
            width: 42px;
            height: 57px;
            border: 0;
            border-right: 1px solid #ffffff55;
            color: #fff;
            background: #7e161f6b;
            font-size: 26px
        }

        .logo {
            width: 150px;
            height: 57px;
            object-fit: cover
        }

        .head-right {
            margin-left: auto;
            padding: 0 25px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff
        }

        .session {
            text-align: right;
            border-right: 1px solid #fff6;
            padding-right: 14px;
            font-size: 11px
        }

        .avatar-head {
            width: 35px;
            height: 35px;
            border: 1px solid #fff8;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #ffffff33
        }

        .page {
            padding: 6px 8px 30px
        }

        .primary {
            min-width: 140px;
            padding: 9px 20px;
            border: 0;
            border-radius: 18px;
            color: #fff;
            background: #9A2529;
            font-size: 12px;
            font-weight: 700
        }

        .view {
            display: block;
            margin-top: 8px
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .back {
            padding: 5px 11px;
            border: 1px solid #E45F14;
            border-radius: 18px;
            color: #A92129;
            background: #FFF4EC;
            font-size: 11px;
            font-weight: 900
        }

        .docs {
            border: 0;
            color: #9A2529;
            background: none;
            text-decoration: underline;
            font-weight: 600
        }

        .switcher {
            margin: 12px auto 4px;
            display: flex;
            justify-content: center;
            gap: 7px
        }

        .shared-avatar {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid #E45F14;
            border-radius: 50%;
            color: #9A2529;
            background: #FFF4EC;
            font-size: 12px;
            font-weight: 800
        }

        .tabs {
            display: flex;
            gap: 18px
        }

        .tab {
            padding: 5px 2px 7px;
            border: 0;
            border-bottom: 2px solid transparent;
            color: #667085;
            background: none;
            font-size: 12px;
            font-weight: 600
        }

        .tab.active {
            border-bottom-color: #E45F14;
            color: #9A2529;
            font-weight: 800
        }

        .search {
            margin-top: 8px;
            padding: 10px 12px;
            display: flex;
            gap: 6px;
            border: 1px solid #E4E7EC;
            border-radius: 6px;
            background: #F8FAFC
        }

        .search input {
            width: 280px;
            height: 34px;
            padding: 6px 10px;
            border: 1px solid #CBD0D7;
            border-radius: 6px
        }

        .search button {
            height: 34px;
            padding: 0 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600
        }

        .search-go {
            border: 0;
            color: #fff;
            background: #9A2529
        }

        .search-clear {
            border: 1px solid #9A2529;
            color: #9A2529;
            background: #fff
        }

        .medical-layout {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 6px
        }

        .medical-nav {
            width: 208px;
            min-width: 208px;
            position: sticky;
            top: 8px;
            max-height: 100vh;
            overflow: auto;
            border: 1px solid #D6D8DC;
            border-radius: 4px;
            background: #F8F9FB
        }

        .group {
            width: 100%;
            padding: 10px 12px;
            border: 0;
            border-bottom: 1px solid #E4E7EC;
            display: flex;
            justify-content: space-between;
            color: #344054;
            background: #EEF2F6;
            text-align: left;
            font-size: 12px;
            font-weight: 700
        }

        .nav-item {
            width: 100%;
            padding: 9px 12px;
            border: 0;
            border-bottom: 1px solid #EAECEF;
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            color: #667085;
            background: transparent;
            text-align: left;
            font-size: 11.5px
        }

        .nav-item.active {
            border-left-color: #DE2C3B;
            color: #B42318;
            background: #fff;
            font-weight: 600
        }

        .medical-content {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .card {
            scroll-margin-top: 70px;
            overflow: hidden;
            border: 1px solid #E4E7EC;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 1px 2px #10182814
        }

        .card.highlight {
            border: 2px solid #E45F14;
            box-shadow: 0 0 0 3px #e45f1420
        }

        .card-head {
            padding: 7px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #E4E7EC;
            background: #F8FAFC
        }

        .card-title {
            border: 0;
            color: #1F2937;
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            text-align: left
        }

        .card-actions {
            display: flex;
            gap: 8px
        }

        .smallbtn {
            min-width: 72px;
            padding: 5px 10px;
            border: 0;
            border-radius: 4px;
            color: #fff;
            background: #9A2529;
            font-size: 11.5px
        }

        .reset {
            border: 1px solid #9A2529;
            color: #9A2529;
            background: #fff
        }

        .card-body {
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px
        }

        .card-body.blood-pressure-body {
            display: block;
        }

        .blood-pressure-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
        }

        .blood-pressure-row + .blood-pressure-row {
            margin-top: 12px;
        }

        .blood-pressure-row.pulse-rate-row {
            grid-template-columns: minmax(0, 1fr);
            max-width: calc((100% - 24px) / 3);
        }

        .family-history-body {
            display: block;
        }

        .family-history-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            overflow: hidden;
            border: 1px solid #E1E5EA;
            border-radius: 6px;
            background: #fff;
            box-shadow: none;
        }

        .family-history-table th,
        .family-history-table td {
            padding: 9px 10px;
            border: 0;
            border-bottom: 1px solid #E1E5EA;
            text-align: left;
            vertical-align: middle;
        }

        .family-history-table th {
            color: #1F3B63;
            background: #F7F8FA;
            font-weight: 700;
            letter-spacing: .1px;
        }

        .family-history-table tbody tr:nth-child(even) {
            background: #fff;
        }

        .family-history-table tbody tr:hover {
            background: #F9FAFB;
        }

        .family-history-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .family-history-table .value,
        .family-history-table select,
        .family-history-table input {
            width: 100%;
            min-height: 34px;
            box-sizing: border-box;
        }

        .family-history-table .value {
            min-height: 32px;
            padding: 7px 8px;
            border: 1px solid #D0D5DD;
            border-radius: 6px;
            color: #344054;
            background: #F3F4F6;
        }

        .family-history-table select,
        .family-history-table input {
            min-height: 32px;
            padding: 5px 8px;
            border: 1px solid #D0D5DD;
            border-radius: 6px;
            color: #344054;
            background: #fff;
            outline: none;
        }

        .family-history-table select:focus,
        .family-history-table input:focus {
            border-color: #98A2B3;
            box-shadow: 0 0 0 3px rgba(152, 162, 179, .18);
        }

        .family-history-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .family-history-actions label {
            color: #344054;
            font-size: 13px;
            font-weight: 600;
        }

        .family-history-actions select {
            width: min(285px, 100%);
            min-height: 34px;
            padding: 5px 8px;
            border: 1px solid #D0D5DD;
            border-radius: 6px;
            background: #fff;
        }

        .family-history-actions .family-history-add {
            border: 1px solid #9A2529;
            color: #fff;
            background: #9A2529;
            font-weight: 700;
        }

        .family-history-actions .family-history-add:hover {
            background: #7F1D21;
        }

        .family-history-delete {
            width: 30px;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 5px;
            color: #9A2529;
            background: transparent;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        .family-history-delete:hover {
            background: #FFF0F0;
        }

        .field label {
            display: flex;
            gap: 2px;
            margin-bottom: 3px;
            color: #444;
            font-size: 12px
        }

        .required {
            color: #B42318
        }

        .value {
            min-height: 36px;
            padding: 9px 10px;
            border: 1px solid #E4E7EC;
            border-radius: 8px;
            color: #344054;
            background: #F3F4F6;
            font-size: 12px
        }

        .field input,
        .field select {
            width: 100%;
            height: 36px;
            padding: 7px 10px;
            border: 1px solid #CBD0D7;
            border-radius: 8px;
            background: #fff;
            font-size: 12px
        }

        .hidden {
            display: none
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 40;
            display: none;
            padding: 12px 16px;
            border-radius: 6px;
            color: #fff;
            background: #027A48
        }

        .toast.show {
            display: block
        }

        @media(max-width:800px) {
            .medical-layout {
                flex-direction: column
            }

            .medical-nav {
                width: 100%;
                min-width: 0;
                max-height: 270px;
                position: static
            }

            .card-body {
                grid-template-columns: 1fr 1fr
            }

            .head-right .session {
                display: none
            }
        }

        @media(max-width:520px) {
            .card-body {
                grid-template-columns: 1fr
            }

            .search input {
                width: 100%
            }

            .search {
                flex-wrap: wrap
            }

            .logo {
                width: 128px
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="view" id="view">
            <div class="topbar"><button class="back" id="back">← Back to DRS</button>

                <div class="switcher">
                    <div class="shared-avatar" id="person-avatar">LA</div>
                    <div class="tabs" role="tablist"><button class="tab active" data-tab="life">Life
                            Assured1</button><button class="tab" data-tab="Proposer">Proposer</button></div>
                </div>
                <button class="docs" id="docs">View
                    Medical Documents</button>
            </div>

            <div class="search"><input id="medical-search" placeholder="Search medical section..."><button
                    class="search-go" id="search-go">Search</button><button class="search-clear"
                    id="search-clear">Clear</button></div>
            <div class="medical-layout">
                <nav class="medical-nav" id="medical-nav"></nav>
                <div class="medical-content" id="medical-content"></div>
            </div>
            <div style="display:flex;justify-content:flex-end;padding:14px"><button class="primary"
                    id="submit-medical">Submit</button></div>
        </section>
    </main>
    <div class="toast" id="toast"></div>
    <script>
        const esc = value => String(value).replace(/[&<>'\"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
        function toast(message) { const element = document.getElementById('toast'); element.textContent = message; element.classList.add('show'); setTimeout(() => element.classList.remove('show'), 2500); }
        const medicalGroups = [{ name: 'MER', items: [['MER', ['Application No.', 'First Name', 'Last Name', 'Is MER name same as proposal name?', 'Place of Examination', 'Gender', 'Name of ME', 'ME Code', 'Examinee DOB', 'Date of Examination']], ['Habit and Addictions', ['Cigarettes/beedis/cigar', 'Cigarettes/beedis/cigar Quant', 'Gutka / snuff / paan etc.', 'Narcotic Consumption', 'Beer/Wine/Hard liquor']], ['Measurement', ['Height (cms)', 'Height (Fts)', 'Inches', 'Weight (Kgs)', 'Waist (cms)', 'Hips (cms)', 'BMI']], ['Family history and health status', ['Relation', 'Age', 'Health Status', 'Dead or Alive']], ['Blood pressure and Pulse details', ['Systolic 1', 'Diastolic 1', 'Systolic 2', 'Diastolic 2', 'Pulse Rate', 'Average Systolic', 'Average Diastolic']], ['Question Table', []]] }, { name: 'SPECIAL MEDICAL', items: [['2DECHO', ['Medical Type', 'Test Date', 'Findings', 'Ejection Fraction', 'Ejection Result', 'Rejection Abnormality', 'Examinee Name', 'Examinee Age', 'Diagnostic Centre Name', 'Doctor Name', 'Doctor Registration No', 'Remarks']], ['BLOOD UREA and NITRO', ['Medical Type', 'Test Date','Findings', 'Blood Urea', 'BUN', 'Result', 'Examinee Name', 'Examinee Age', 'Diagnostic Centre Name', 'Doctor Name', 'Doctor Registration No', 'Remark']], ['CXR', ['Medical Type', 'Test Date', 'Findings', 'Examinee Name', 'Examinee Age', 'Diagnostic Centre Name', 'Doctor Name', 'Doctor Registration No', 'Remark']], ['ECG', ['Medical Type', 'Test Date', 'Findings', 'Axis', 'Heart Rate', 'Heart Rate Finding', 'Examinee Name', 'Examinee Age', 'Diagnostic Centre Name', 'Doctor Name', 'Doctor Registration No', 'Remark']], ['PFT', ['Medical Type', 'Date', 'FEV1', 'FVC', 'FEV1/FVC', 'RV', 'VC']], ['TMT', ['Medical Type', 'Test Date', 'Findings', 'METS', 'Heart Rate Finding', 'Heart Rate Result', 'Examinee Name', 'Examinee Age', 'Remarks']], ['USG', ['Medical Type', 'Test Date', 'Findings', 'Examinee Name', 'Examinee Age', 'Diagnostic Centre Name', 'Doctor Name', 'Remarks']], ['Fundoscopy Test', ['Medical Type', 'Test Date', 'Findings', 'Examinee Name', 'Examinee Age', 'Diagnostic Centre Name', 'Doctor Name', 'Remarks']]] }, { name: 'OTHER MEDICALS', items: [['Blood Sugar Random', ['Medical Type', 'Test Date', 'Value', 'Examinee Name', 'Examinee Age', 'Diagnostic Centre Name']], ['CBC Group', ['Medical Type', 'Test Date', 'Haemoglobin', 'RBC Count', 'WBC Count', 'Platelet Count', 'Findings']], ['COT', ['Medical Type', 'Test Date', 'Value', 'Examinee Name', 'Examinee Age']], ['HBA1C', ['Medical Type', 'Test Date', 'Value', 'Examinee Name', 'Examinee Age']], ['HBSAG', ['Medical Type', 'Test Date', 'Value', 'Examinee Name', 'Examinee Age']], ['LFT', ['Medical Type', 'Test Date', 'SGPT/ALT', 'SGOT/AST', 'GGT', 'Serum Bilirubin-Total', 'Findings']], ['LIPIDS', ['Medical Type', 'Test Date', 'Total Cholesterol', 'HDL Cholesterol', 'LDL Cholesterol', 'Triglycerides']], ['OGTT Group', ['Medical Type', 'Test Date', 'Fasting', '1 Hour', '2 Hour', 'Findings']], ['RUA Group', ['Medical Type', 'Test Date', 'Sugar/Glycosuria', 'Albumin/Proteinuria', 'RBC/Haematuria', 'Ketone Bodies', 'Urine Colour', 'Urine Appearance']], ['FBS', ['Medical Type', 'Test Date', 'Value', 'Examinee Name', 'Examinee Age']], ['HCV', ['Medical Type', 'Test Date', 'Value', 'Examinee Name', 'Examinee Age']], ['PSA', ['Medical Type', 'Test Date', 'Value', 'Examinee Name', 'Examinee Age']]] }];



        // Grouped result cards use the workbook's Value, Findings, lab-range and units columns.
        let active = '', editing = null, snapshots = {}; function fieldHTML(label, id) { let select = /^(Is |Gender|Medical Type|Findings|Axis|METS|Dead or Alive|Answer|Value$)/.test(label) || /^\d+\.[a-z]\s*—/.test(label), ro = /^(Application No.|Height \(Fts\)|Inches|BMI|Ejection Result|Heart Rate Finding|Heart Rate Result|Average)/.test(label), required = /^(First Name|Place of Examination|Gender|Name of ME|Examinee DOB|Date of Examination|Height \(cms\)|Weight \(Kgs\)|Findings|Ejection Fraction|Blood Urea|BUN|Heart Rate|FEV1|FVC|FEV1\/FVC|Value)/.test(label); let control = select ? `<select data-field="${id}" disabled><option>Select</option><option>Yes</option><option>No</option><option>Normal</option></select>` : `<div class="value" data-field="${id}">${ro ? '-' : ''}</div>`; return `<div class="field"><label>${esc(label)}${required ? '<span class="required">*</span>' : ''}</label>${control}</div>` } function renderMedical() { let nav = document.getElementById('medical-nav'), content = document.getElementById('medical-content'); nav.innerHTML = ''; content.innerHTML = ''; medicalGroups.forEach((g, gi) => { let group = document.createElement('div'); group.innerHTML = `<button class="group" data-group="${gi}">${g.name}<span>⌄</span></button><div class="g-items"></div>`; let list = group.querySelector('.g-items'); g.items.forEach((item, ii) => { let id = `g${gi}s${ii}`, b = document.createElement('button'); b.className = 'nav-item'; b.dataset.target = id; b.innerHTML = `<span>${item[0]}</span><span>›</span>`; list.append(b); content.insertAdjacentHTML('beforeend', `<article class="card" id="${id}"><header class="card-head"><button class="card-title" data-toggle="${id}">⌄ &nbsp; ${esc(item[0])}</button><div class="card-actions"><button class="smallbtn reset hidden" data-reset="${id}">Reset</button><button class="smallbtn" data-edit="${id}">Edit</button></div></header><div class="card-body">${item[1].map((f, i) => fieldHTML(f, `${id}-${i}`)).join('')}</div></article>`) }); nav.append(group) }); nav.querySelectorAll('.nav-item').forEach(b => b.onclick = () => { document.getElementById(b.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' }); setActive(b.dataset.target) }); nav.querySelectorAll('.group').forEach(b => b.onclick = () => b.parentElement.querySelector('.g-items').classList.toggle('hidden')); content.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => b.closest('.card').querySelector('.card-body').classList.toggle('hidden')); content.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editCard(b.dataset.edit, b)); content.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetCard(b.dataset.reset)); let ob = new IntersectionObserver(es => { let e = es.filter(x => x.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]; if (e) setActive(e.target.id) }, { rootMargin: '-90px 0px -60% 0px', threshold: .05 }); content.querySelectorAll('.card').forEach(c => ob.observe(c)) } function setActive(id) { active = id; document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.target === id)) } function editCard(id, b) { let card = document.getElementById(id), isEdit = card.dataset.edit === '1'; if (!isEdit) { snapshots[id] = [...card.querySelectorAll('[data-field]')].map(x => x.outerHTML); card.dataset.edit = '1'; b.textContent = 'Save'; card.querySelector('[data-reset]').classList.remove('hidden'); card.querySelectorAll('.value').forEach(x => { let i = document.createElement('input'); i.dataset.field = x.dataset.field; i.value = x.textContent === '-' ? '' : x.textContent; x.replaceWith(i) }); card.querySelectorAll('select').forEach(x => x.disabled = false) } else { card.dataset.edit = '0'; b.textContent = 'Edit'; card.querySelector('[data-reset]').classList.add('hidden'); card.querySelectorAll('input[data-field]').forEach(x => { let d = document.createElement('div'); d.className = 'value'; d.dataset.field = x.dataset.field; d.textContent = x.value || '-'; x.replaceWith(d) }); card.querySelectorAll('select').forEach(x => x.disabled = true); toast(card.querySelector('.card-title').textContent.trim() + ' saved successfully.') } } function resetCard(id) { let card = document.getElementById(id); if (snapshots[id]) { let fields = [...card.querySelectorAll('[data-field]')]; snapshots[id].forEach((html, i) => fields[i]?.replaceWith(document.createRange().createContextualFragment(html))); card.dataset.edit = '0'; card.querySelector('[data-edit]').textContent = 'Edit'; card.querySelector('[data-reset]').classList.add('hidden') } }
        renderMedical();
        document.getElementById('back').onclick = () => {
            if (window.parent !== window) {
                window.parent.postMessage('close-medical-view', window.location.origin);
                return;
            }
            window.history.back();
        };
        document.getElementById('submit-medical').onclick = () => toast('Medical details submitted successfully.');
        document.getElementById('docs').onclick = () => toast('Medical documents are available in the source application.');
        let activeTab = 'life';
        document.querySelectorAll('[data-tab]').forEach(tab => tab.onclick = () => {
            activeTab = tab.dataset.tab;
            document.getElementById('person-avatar').textContent = activeTab === 'life' ? 'LA' : 'P';
            document.querySelectorAll('[data-tab]').forEach(item => item.classList.toggle('active', item.dataset.tab === activeTab));
        });
    </script>
    <style>
        /* Shared application chrome, aligned with the Financial prototype. */
        .app-header {
            align-items: stretch;
            overflow: visible;
        }

        .header-back {
            height: 57px;
            background: rgba(126, 22, 31, .42);
        }

        .logo {
            width: 150px;
            object-fit: cover;
        }

        .header-user {
            position: relative;
            padding-right: 14px;
            gap: 0;
        }

        .header-user .session {
            padding-right: 14px;
            font-size: 11px;
            line-height: 1.45;
        }

        .profile-trigger {
            margin-left: 20px;
            padding: 4px 8px;
            border: 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            color: #fff;
            background: transparent;
            cursor: pointer;
        }

        .profile-trigger:hover {
            background: rgba(255, 255, 255, .14);
        }

        .profile-circle {
            width: 35px;
            height: 35px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .45);
            border-radius: 50%;
            background: rgba(255, 255, 255, .2);
            font-size: 20px;
        }

        .profile-name {
            min-width: 80px;
            margin: 0 8px 0 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
        }

        .chevron {
            font-size: 17px;
            line-height: 1;
            transition: transform .15s ease;
        }

        .profile-trigger[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }

        .user-menu {
            position: absolute;
            top: 52px;
            right: 8px;
            width: 130px;
            padding: 4px;

    <script>
        // Medical search intentionally searches section titles only.
        function clearMedicalSearch() {
            const searchInput = document.getElementById("medical-search");

            if (searchInput) {
                searchInput.value = "";
            }

            document.querySelectorAll(".card.highlight").forEach((card) => {
                card.classList.remove("highlight");
            });
        }

        function searchMedicalSections() {
            const searchInput = document.getElementById("medical-search");

            if (!searchInput) {
                return;
            }

            const query = searchInput.value.trim().toLowerCase();

            document.querySelectorAll(".card.highlight").forEach((card) => {
                card.classList.remove("highlight");
            });

            if (!query) {
                return;
            }

            const matchingCard = Array.from(
                document.querySelectorAll(".medical-content .card"),
            ).find((card) => {
                const title = card.querySelector(".card-title")?.textContent ?? "";
                return title.toLowerCase().includes(query);
            });

            if (!matchingCard) {
                toast("No medical section found.");
                return;
            }

            matchingCard.querySelector(".card-body")?.classList.remove("hidden");
            matchingCard.classList.add("highlight");
            matchingCard.scrollIntoView({ behavior: "smooth", block: "start" });

            if (typeof setActive === "function") {
                setActive(matchingCard.id);
            }
        }

        const medicalSearchButton = document.getElementById("search-go");
        const medicalSearchClearButton = document.getElementById("search-clear");
        const medicalSearchInput = document.getElementById("medical-search");

        if (medicalSearchButton) {
            medicalSearchButton.onclick = searchMedicalSections;
        }

        if (medicalSearchClearButton) {
            medicalSearchClearButton.onclick = clearMedicalSearch;
        }

        if (medicalSearchInput) {
            medicalSearchInput.onkeydown = (event) => {
                if (event.key === "Enter") {
                    event.preventDefault();
                    searchMedicalSections();
                }
            };
        }

    </script>

            const masterOptions = {
                yes_no: [
                    { value: "Y", label: "Yes" },
                    { value: "N", label: "No" },
                ],
                place_of_examination: [
                    { value: "CLINIC", label: "Clinic" },

                    { value: "M", label: "Male" },

                ],
                mer_education_sd: [
                    { value: "GRADUATE", label: "Graduate" },

                    { value: "SECONDARY", label: "Secondary" },
                ],
                mer_occupation_sd: [
                    { value: "SALARIED", label: "Salaried" },
                    { value: "SELF_EMPLOYED", label: "Self Employed" },
                    { value: "PROFESSIONAL", label: "Professional" },
                ],
                family_relation: [
                    { value: "BROTHER", label: "Brother" },
                    { value: "SISTER", label: "Sister" },
                    { value: "SON", label: "Son" },
                    { value: "DAUGHTER", label: "Daughter" },
                ],
                dead_or_alive: [
                    { value: "A", label: "Alive" },
                    { value: "D", label: "Dead" },
                ],
            };

            const normalizeAnswer = (value) => {
                const normalized = String(value ?? "").trim().toLowerCase();
                if (normalized === "yes" || normalized === "y") return "y";
                if (normalized === "no" || normalized === "n") return "n";
                return normalized;
            };

            const fallbackFieldConfig = (field, id) => {
                const label = String(field);
                const isDropdown = /^(Is |Gender|Medical Type|Findings|Axis|METS|Dead or Alive|Answer|Value$)/.test(label);
                const isReadonly = /^(Application No\.|Height \(Fts\)|Inches|BMI|Ejection Result|Heart Rate Finding|Heart Rate Result|Average)/.test(label);
                const isRequired = /^(First Name|Place of Examination|Gender|Name of ME|Examinee DOB|Date of Examination|Height \(cms\)|Weight \(Kgs\)|Findings|Ejection Fraction|Blood Urea|BUN|Heart Rate|FEV1|FVC|FEV1\/FVC|Value)/.test(label);

                return {
                    id,
                    label,
                    type: isDropdown ? "dropdown" : "text",
                    required: isRequired,
                    editable: !isReadonly,
                };
            };

            const asFieldConfig = (field, fallbackId) =>
                field && typeof field === "object"
                    ? field
                    : fallbackFieldConfig(field, fallbackId);

            const getOptions = (field) => {
                if (field.masterKey && masterOptions[field.masterKey]) {
                    return masterOptions[field.masterKey];
                }

                if (field.type === "dropdown") {
                    return [
                        { value: "Y", label: "Yes" },
                        { value: "N", label: "No" },
                        { value: "NORMAL", label: "Normal" },
                    ];
                }

                return [];
            };

            const dataAttributes = (field, id) => {
                const attributes = [
                    `data-field="${esc(id)}"`,
                    `data-field-type="${esc(field.type || "text")}"`,
                    `data-editable="${field.editable === false ? "0" : "1"}"`,
                    `data-base-required="${field.required ? "1" : "0"}"`,
                ];

                if (field.masterKey) attributes.push(`data-master-key="${esc(field.masterKey)}"`);
                if (field.defaultValue !== undefined) attributes.push(`data-default-value="${esc(field.defaultValue)}"`);
                if (field.disableFutureDate) attributes.push('data-disable-future-date="1"');
                if (field.requiredWhen) {
                    attributes.push(`data-required-when-field="${esc(field.requiredWhen.fieldId)}"`);
                    attributes.push(`data-required-when-value="${esc(field.requiredWhen.value)}"`);
                }

                return attributes.join(" ");
            };

            const selectMarkup = (field, id, currentValue = "", enabled = false) => {
                const options = getOptions(field);
                const normalizedCurrent = normalizeAnswer(currentValue);
                const optionMarkup = [
                    `<option value="">Select</option>`,
                    ...options.map((option) => {
                        const selected =
                            normalizeAnswer(option.value) === normalizedCurrent ||
                            normalizeAnswer(option.label) === normalizedCurrent;
                        return `<option value="${esc(option.value)}" ${selected ? "selected" : ""}>${esc(option.label)}</option>`;
                    }),
                ].join("");

                return `<select ${dataAttributes(field, id)} ${enabled && field.editable !== false ? "" : "disabled"}>${optionMarkup}</select>`;
            };

            const readonlyMarkup = (field, id, value = "") => {
                const displayValue = value || field.defaultValue || "-";
                return `<div class="value ${field.editable === false ? "locked" : ""}" ${dataAttributes(field, id)}>${esc(displayValue)}</div>`;
            };

            const controlMarkup = (field, id) =>
                field.type === "dropdown"
                    ? selectMarkup(field, id, field.defaultValue || "", false)
                    : readonlyMarkup(field, id, field.defaultValue || "");

            const requiredMark = () => '<span class="required" aria-hidden="true">*</span>';

            const renderField = (rawField, fallbackId, questionTable = false) => {
                const field = asFieldConfig(rawField, fallbackId);
                const id = String(field.id ?? fallbackId);
                const label = `${esc(field.label)}${field.required ? requiredMark() : ""}`;
                const control = controlMarkup(field, id);

                if (questionTable) {
                    return `<div class="question-table-row">
                        <div class="question-table-id">${esc(id)}</div>
                        <div class="question-table-label" data-label-for="${esc(id)}" data-base-required="${field.required ? "1" : "0"}">${label}</div>
                        <div class="question-table-control">${control}</div>
                        <div class="question-table-control"><div class="value" data-field="${esc(id)}-remarks" data-field-type="text" data-editable="1" data-question-remark-for="${esc(id)}">-</div></div>
                    </div>`;
                }

                return `<div class="field">
                    <label data-label-for="${esc(id)}" data-base-required="${field.required ? "1" : "0"}">${label}</label>
                    ${control}
                </div>`;
            };

            const familyRelationOptions = ["Father", "Mother", "Brother", "Sister", "Spouse", "Son", "Daughter", "Grandfather", "Grandmother", "Other"];
            const familyRelationControl = (field) => {
                const selected = String(field.defaultValue || "").toLowerCase();
                const options = ["<option value=\"\">Select</option>", ...familyRelationOptions.map((relation) =>
                    `<option value="${esc(relation)}" ${relation.toLowerCase() === selected ? "selected" : ""}>${esc(relation)}</option>`,
                )].join("");
                return `<select ${dataAttributes({ ...field, editable: true, type: "dropdown" }, field.id)} data-family-relation="1" disabled>${options}</select>`;
            };

            const familyHistoryTableMarkup = (fields) => {
                const fieldById = Object.fromEntries(fields.map((field) => [field.id, field]));
                const rows = [
                    ["fatherRelation", "fatherAge", "fatherHealthStatus", "fatherDeadOrAlive"],
                    ["motherRelation", "motherAge", "motherHealthStatus", "motherDeadOrAlive"],
                    ["otherRelation", "otherAge", "otherHealthStatus", "otherDeadOrAlive"],
                ];
                const cellMarkup = (field) => field.id.endsWith("Relation")
                    ? familyRelationControl(field)
                    : controlMarkup(field, field.id);
                return `<div class="family-history-actions"><label for="mer-family-add-relation">Relation:</label><select id="mer-family-add-relation" data-family-add-relation disabled><option value="">Select a relation</option>${familyRelationOptions.map((relation) => `<option value="${esc(relation)}">${esc(relation)}</option>`).join("")}</select><button class="smallbtn family-history-add" type="button">Add</button></div><table class="family-history-table"><thead><tr><th>Relation Type</th><th>Age</th><th>Dead or alive</th><th>Health Status</th><th>Action</th></tr></thead><tbody>${rows.map((row) => `<tr>${[row[0], row[1], row[3], row[2]].map((fieldId) => `<td>${cellMarkup(fieldById[fieldId])}</td>`).join("")}<td><button class="family-history-delete" type="button" aria-label="Delete family history record" title="Delete record">×</button></td></tr>`).join("")}</tbody></table>`;
            };

            const familyHistoryNewRowMarkup = (rowId, relation) => `<tr data-added-row="1">
                <td><select data-field="${rowId}-relation" data-field-type="dropdown" data-editable="1" data-family-relation="1"><option value="">Select</option>${familyRelationOptions.map((option) => `<option value="${esc(option)}" ${option === relation ? "selected" : ""}>${esc(option)}</option>`).join("")}</select></td>
                <td><input type="number" data-field="${rowId}-age" data-field-type="number" data-editable="1" /></td>
                <td><select data-field="${rowId}-dead-alive" data-field-type="dropdown" data-editable="1"><option value="">Select</option><option value="A">Alive</option><option value="D">Dead</option></select></td>
                <td><input type="text" data-field="${rowId}-health-status" data-field-type="text" data-editable="1" /></td>
                <td><button class="family-history-delete" type="button" aria-label="Delete added family history record" title="Delete record">×</button></td>
            </tr>`;

            const hasDuplicateFamilyRelation = (card, selected) => Array.from(card.querySelectorAll("[data-family-relation]")).filter((control) => control.value && control.value.toLowerCase() === selected.toLowerCase()).length > 1;

            const getFieldElement = (card, fieldId) =>
                Array.from(card.querySelectorAll("[data-field]")).find(
                    (element) => element.dataset.field === fieldId,
                );

            const getControlValue = (control) => {
                if (!control) return "";
                if (control.tagName === "SELECT" || control.tagName === "INPUT") return control.value;
                return control.textContent === "-" ? "" : control.textContent.trim();
            };

            const syncConditionalRequired = (card) => {
                card.querySelectorAll("[data-label-for]").forEach((label) => {
                    const control = getFieldElement(card, label.dataset.labelFor);
                    if (!control) return;

                    const requiredWhenField = control.dataset.requiredWhenField;
                    const requiredWhenValue = control.dataset.requiredWhenValue;
                    const dependency = requiredWhenField
                        ? getFieldElement(card, requiredWhenField)
                        : null;
                    const conditionMatches = dependency &&
                        normalizeAnswer(getControlValue(dependency)) === normalizeAnswer(requiredWhenValue);
                    const isRequired = control.dataset.baseRequired === "1" || Boolean(conditionMatches);
                    let mark = label.querySelector(".required");

                    if (isRequired && !mark) {
                        label.insertAdjacentHTML("beforeend", requiredMark());
                    } else if (!isRequired && mark) {
                        mark.remove();
                    }
                });
            };

            const syncQuestionRemarks = (card) => {
                card.querySelectorAll("[data-question-remark-for]").forEach((remark) => {
                    const response = getFieldElement(card, remark.dataset.questionRemarkFor);
                    const required = normalizeAnswer(getControlValue(response)) === "y";
                    remark.classList.toggle("question-remark-required", required);
                    remark.required = required;
                    let mark = remark.closest(".question-table-control")?.querySelector(".question-remark-mark");
                    if (required && !mark) remark.insertAdjacentHTML("afterend", '<span class="required question-remark-mark" aria-label="Remarks required">*</span>');
                    if (!required && mark) mark.remove();
                });
            };

            medicalGroups[0].items = merSectionsFromTypeScript.map((section) => [
                section.title,
                section.fields,
            ]);

            fieldHTML = (field, id) => renderField(field, id, false);

            renderMedical = () => {
                const nav = document.getElementById("medical-nav");
                const content = document.getElementById("medical-content");
                nav.innerHTML = "";
                content.innerHTML = "";

                medicalGroups.forEach((groupConfig, groupIndex) => {
                    const group = document.createElement("div");
                    group.innerHTML = `<button class="group" data-group="${groupIndex}">${esc(groupConfig.name)}<span>⌄</span></button><div class="g-items"></div>`;
                    const list = group.querySelector(".g-items");

                    groupConfig.items.forEach((item, sectionIndex) => {
                        const sectionId = `g${groupIndex}s${sectionIndex}`;
                        const sectionTitle = item[0];
                        const fields = item[1];
                        const questionTable = groupIndex === 0 && sectionTitle === "Question Table";
                        const navButton = document.createElement("button");
                        navButton.className = "nav-item";
                        navButton.dataset.target = sectionId;
                        navButton.innerHTML = `<span>${esc(sectionTitle)}</span><span>›</span>`;
                        list.append(navButton);

                        const fieldsMarkup = fields.map((field, fieldIndex) => {
                            const stableId = field && typeof field === "object" && field.id !== undefined
                                ? String(field.id)
                                : `${sectionId}-${fieldIndex}`;
                            return renderField(field, stableId, questionTable);
                        }).join("");

                        const isBloodPressureSection = groupIndex === 0 && sectionTitle === "Blood pressure and Pulse details";
                        const isFamilyHistorySection = groupIndex === 0 && sectionTitle === "Family history and health status";
                        const bloodPressureRows = isBloodPressureSection
                            ? [
                                ["systolic1", "systolic2", "systolic3", "systolic4", "avgSystolic"],
                                ["diastolic1", "diastolic2", "diastolic3", "diastolic4", "avgDiastolic"],
                                ["pulseRate"],
                            ].map((row, rowIndex) => {
                                const rowFields = row.map((fieldId) => fields.find((field) => field.id === fieldId)).filter(Boolean);
                                const rowMarkup = rowFields.map((field) => renderField(field, field.id, false)).join("");
                                return `<div class="blood-pressure-row ${rowIndex === 2 ? "pulse-rate-row" : ""}">${rowMarkup}</div>`;
                            }).join("")
                            : fieldsMarkup;

                        const renderedFields = isFamilyHistorySection
                            ? familyHistoryTableMarkup(fields)
                            : bloodPressureRows;
                        const questionHeader = questionTable
                            ? '<div class="question-table-head"><span>Question Id</span><span>Question</span><span>Response</span><span>Remarks</span></div>'
                            : "";
                        const bodyClass = questionTable
                            ? "card-body question-table"
                            : `card-body${isBloodPressureSection ? " blood-pressure-body" : ""}${isFamilyHistorySection ? " family-history-body" : ""}`;

                        content.insertAdjacentHTML("beforeend", `<article class="card" id="${sectionId}">
                            <header class="card-head">
                                <button class="card-title" data-toggle="${sectionId}">⌄ &nbsp; ${esc(sectionTitle)}</button>
                                <div class="card-actions">
                                    <button class="smallbtn reset hidden" data-reset="${sectionId}">Reset</button>
                                    <button class="smallbtn" data-edit="${sectionId}">Edit</button>
                                </div>
                            </header>
                            <div class="${bodyClass}">${questionHeader}${renderedFields}</div>
                        </article>`);
                    });

                    nav.append(group);
                });

                nav.querySelectorAll(".nav-item").forEach((button) => {
                    button.onclick = () => {
                        document.getElementById(button.dataset.target).scrollIntoView({ behavior: "smooth", block: "start" });
                        setActive(button.dataset.target);
                    };
                });
                nav.querySelectorAll(".group").forEach((button) => {
                    button.onclick = () => button.parentElement.querySelector(".g-items").classList.toggle("hidden");
                });
                content.querySelectorAll("[data-toggle]").forEach((button) => {
                    button.onclick = () => button.closest(".card").querySelector(".card-body").classList.toggle("hidden");
                });
                content.querySelectorAll("[data-edit]").forEach((button) => {
                    button.onclick = () => editCard(button.dataset.edit, button);
                });
                content.querySelectorAll("[data-reset]").forEach((button) => {
                    button.onclick = () => resetCard(button.dataset.reset);
                });
                content.querySelectorAll(".card-body").forEach((body) => {
                    body.addEventListener("change", () => {
                        const card = body.closest(".card");
                        syncConditionalRequired(card);
                        syncQuestionRemarks(card);
                    });
                });
                content.querySelectorAll(".family-history-body").forEach((body) => {
                    body.addEventListener("change", (event) => {
                        if (!event.target.matches("[data-family-relation]")) return;
                        if (hasDuplicateFamilyRelation(body.closest(".card"), event.target.value)) {
                            event.target.value = "";
                            toast("This relation is already added. Please choose a different relation.");
                        }
                    });
                    body.addEventListener("click", (event) => {
                        const deleteButton = event.target.closest(".family-history-delete");
                        if (deleteButton) {
                            const card = body.closest(".card");
                            if (card.dataset.edit !== "1") {
                                toast("Select Edit before deleting a family history record.");
                                return;
                            }
                            deleteButton.closest("tr")?.remove();
                            return;
                        }
                        const addButton = event.target.closest(".family-history-add");
                        if (!addButton) return;
                        const card = body.closest(".card");
                        if (card.dataset.edit !== "1") {
                            toast("Select Edit before adding a family history record.");
                            return;
                        }
                        const relationInput = body.querySelector("[data-family-add-relation]");
                        const relation = relationInput?.value || "";
                        if (!relation) {
                            toast("Select a relation before adding a record.");
                            return;
                        }
                        const selectedRelations = new Set(Array.from(card.querySelectorAll("[data-family-relation]")).map((control) => control.value).filter(Boolean));
                        if (selectedRelations.has(relation)) {
                            toast("This relation is already added. Please choose a different relation.");
                            return;
                        }
                        body.querySelector("tbody").insertAdjacentHTML("beforeend", familyHistoryNewRowMarkup(`family-extra-${Date.now()}`, relation));
                        relationInput.value = "";
                    });
                });

                const observer = new IntersectionObserver((entries) => {
                    const visibleEntry = entries
                        .filter((entry) => entry.isIntersecting)
                        .sort((left, right) => right.intersectionRatio - left.intersectionRatio)[0];
                    if (visibleEntry) setActive(visibleEntry.target.id);
                }, { rootMargin: "-90px 0px -60% 0px", threshold: 0.05 });
                content.querySelectorAll(".card").forEach((card) => observer.observe(card));
            };

            const copyDataset = (from, to) => {
                Object.entries(from.dataset).forEach(([key, value]) => {
                    to.dataset[key] = value;
                });
            };

            const createEditingInput = (valueElement) => {
                const input = document.createElement("input");
                const fieldType = valueElement.dataset.fieldType;
                input.type = fieldType === "date" ? "date" : fieldType === "number" ? "number" : "text";
                input.value = valueElement.textContent.trim() === "-" ? "" : valueElement.textContent.trim();
                if (valueElement.dataset.disableFutureDate === "1") {
                    input.max = new Date().toISOString().slice(0, 10);
                }
                copyDataset(valueElement, input);
                return input;
            };

            const createReadonlyValue = (input) => {
                const valueElement = document.createElement("div");
                valueElement.className = `value ${input.dataset.editable === "0" ? "locked" : ""}`;
                valueElement.textContent = input.value || "-";
                copyDataset(input, valueElement);
                return valueElement;
            };

            editCard = (id, button) => {
                const card = document.getElementById(id);
                const isEditing = card.dataset.edit === "1";

                if (!isEditing) {
                    snapshots[id] = card.querySelector(".card-body").innerHTML;
                    card.dataset.edit = "1";
                    button.textContent = "Save";
                    card.querySelector("[data-reset]").classList.remove("hidden");
                    card.querySelectorAll('.value[data-editable="1"]').forEach((valueElement) => {
                        valueElement.replaceWith(createEditingInput(valueElement));
                    });
                    card.querySelectorAll('select[data-editable="1"], select[data-family-add-relation]').forEach((select) => {
                        select.disabled = false;
                    });
                    syncConditionalRequired(card);
                    syncQuestionRemarks(card);
                    return;
                }

                syncQuestionRemarks(card);
                const missingRemark = Array.from(card.querySelectorAll("[data-question-remark-for]")).find((remark) => {
                    const response = getFieldElement(card, remark.dataset.questionRemarkFor);
                    return normalizeAnswer(getControlValue(response)) === "y" && !getControlValue(remark);
                });
                if (missingRemark) {
                    toast("Remarks are mandatory when the response is Yes.");
                    missingRemark.focus();
                    return;
                }

                card.dataset.edit = "0";
                button.textContent = "Edit";
                card.querySelector("[data-reset]").classList.add("hidden");
                card.querySelectorAll("input[data-field]").forEach((input) => {
                    input.replaceWith(createReadonlyValue(input));
                });
                card.querySelectorAll("select[data-field], select[data-family-add-relation]").forEach((select) => {
                    select.disabled = true;
                });
                syncConditionalRequired(card);
                syncQuestionRemarks(card);
                toast(`${card.querySelector(".card-title").textContent.trim()} saved successfully.`);
            };

            resetCard = (id) => {
                const card = document.getElementById(id);
                if (!snapshots[id]) return;

                card.querySelector(".card-body").innerHTML = snapshots[id];
                card.dataset.edit = "0";
                card.querySelector("[data-edit]").textContent = "Edit";
                card.querySelector("[data-reset]").classList.add("hidden");
                syncConditionalRequired(card);
                syncQuestionRemarks(card);
            };

            window.editCard = editCard;
            window.resetCard = resetCard;

            renderMedical();

            const demoValues = {
                applicationNo: "OB90322247",
                firstName: "Rudra Prakash",
                lastName: "Sangha",
                isMerNameSameAsProposalName: "Y",
                placeOfExamination: "CLINIC",

                gutkaSnuffPaanYear: "",

                narcoticConsumptionYear: "",
                beerWineHardLiquor: "Y",
                beerWineHardLiquorQuant: "2",
                beerWineHardLiquorYear: "2015",
                heightCms: "175",

                weightKgs: "74",

                fatherRelation: "Father",

                motherAge: "58",
                motherHealthStatus: "Healthy",
                motherDeadOrAlive: "A",
                otherRelation: "BROTHER",
                otherAge: "35",
                otherHealthStatus: "Healthy",
                otherDeadOrAlive: "A",
                systolic1: "122",

                pulseRate: "72",
                pulseRemarks: "Regular",
                "3.a": "Y",
            };

            const setFieldValue = (fieldId, value) => {
                const control = Array.from(document.querySelectorAll("[data-field]")).find(
                    (element) => element.dataset.field === fieldId,
                );
                if (!control) return;

                if (control.tagName === "SELECT") {
                    const normalizedValue = normalizeAnswer(value);
                    let option = Array.from(control.options).find(
                        (item) => normalizeAnswer(item.value) === normalizedValue || normalizeAnswer(item.text) === normalizedValue,
                    );
                    if (!option && value) {
                        option = new Option(value, value);
                        control.add(option);
                    }
                    control.value = option ? option.value : "";
                    return;
                }

                control.textContent = value || "-";
            };

            Object.entries(demoValues).forEach(([fieldId, value]) => setFieldValue(fieldId, value));
            document.querySelectorAll(".medical-content .card").forEach(syncConditionalRequired);

            const firstMedicalCard = document.querySelector(".medical-content .card");
            if (firstMedicalCard) setActive(firstMedicalCard.id);
        })();

                        String(option.value).trim().toLowerCase() === normalizedSelected ||
                        String(option.label).trim().toLowerCase() === normalizedSelected,

                    case "ejectionFraction": return "62";
                    case "ejectionResult": return "Normal";
                    case "rejectionAbnormality": return "NORMAL";

                    case "rv": return "1";

                    case "remark":
                    case "remarks": return "No adverse findings";
                    default: return String(10 + sectionIndex);
                }
            };

            const applySpecialMedicalPrototype = (seedMissingValues = false) => {
                specialMedicalSectionsFromTypeScript.forEach((section, sectionIndex) => {
                    const card = document.getElementById(`g1s${sectionIndex}`);
                    if (!card) return;

                    section.fields.forEach((field) => {
                        const control = findSpecialControl(card, field.id);
                        if (!control) return;

                        if (field.validation) control.dataset.validation = field.validation;
                        if (control.tagName !== "SELECT") return;

                        const currentValue = readSpecialControlValue(control);
                        const selectedValue =
                            currentValue ||
                            (seedMissingValues ? specialMedicalDemoValue(field, section, sectionIndex) : "");
                        const options =
                            field.masterKey === "MEDICAL_TYPE"
                                ? [{ value: section.title, label: section.title }]
                                : specialMedicalMasterOptions[field.masterKey] ?? [];
                        setSpecialSelectOptions(control, options, selectedValue);
                    });

                    if (seedMissingValues) {
                        section.fields.forEach((field) => {
                            const control = findSpecialControl(card, field.id);
                            if (!control || readSpecialControlValue(control)) return;
                            setSpecialControlValue(
                                card,
                                field.id,
                                specialMedicalDemoValue(field, section, sectionIndex),
                            );
                        });
                    }

                    card.dataset.edit = "0";
                    card.querySelector(".card-body")?.dispatchEvent(
                        new Event("change", { bubbles: true }),
                    );
                });
            };

            window.applySpecialMedicalPrototype = applySpecialMedicalPrototype;
            applySpecialMedicalPrototype(true);

            const firstRenderedCard = document.querySelector(".medical-content .card");
            if (firstRenderedCard) setActive(firstRenderedCard.id);
        })();

                if (!select) return;

                    '<option value="">Select</option>',
                    ...options.map((option) => {
                        const selected =

                        return `<option value="${esc(option.value)}" ${selected ? "selected" : ""}>${esc(option.label)}</option>`;
                    }),
                ].join("");

            const setControlValue = (card, fieldId, value) => {
                const control = findControl(card, fieldId);
                if (!control) return;

                if (control.tagName === "SELECT") {
                    const normalizedValue = String(value ?? "").trim().toLowerCase();
                    let option = Array.from(control.options).find(
                        (item) =>
                            String(item.value).trim().toLowerCase() === normalizedValue ||
                            String(item.text).trim().toLowerCase() === normalizedValue,
                    );
                    if (!option && value !== "" && value != null) {
                        option = new Option(String(value), String(value));
                        control.add(option);

                    control.value = option ? option.value : "";

                control.textContent = value === "" || value == null ? "-" : String(value);

            const tableValueMarkup = (section, row, column, initialValue = "") => {
                const fieldId = `__table__${row.id}__${column}`;
                const isValueColumn = column === "value";
                const isDropdown = isValueColumn && (row.fieldType === "dropdown" || Boolean(row.masterKey));

                if (isDropdown) {
                    const options = otherMedicalMasterOptions[row.masterKey] ?? otherMedicalMasterOptions.VALUE;

                    const optionsMarkup = [
                        '<option value="">Select</option>',

                        ),
                    ].join("");
                    return `<select ${tableControlAttributes(fieldId, "dropdown", row.id, column)} disabled>${optionsMarkup}</select>`;
                }

                const type = isValueColumn || row.validation === "numeric" ? "number" : "text";
                const displayValue = initialValue === "" ? "-" : initialValue;
                return `<div class="value" ${tableControlAttributes(fieldId, type, row.id, column)}>${esc(displayValue)}</div>`;

            const sampleUnit = (parameter, sectionTitle) => {

                if (/hemoglobin|albumin|globulin|protein/.test(name)) return "g/dL";
                if (/rbc/.test(name)) return "million/µL";
                if (/wbc|platelet/.test(name)) return "/µL";
                if (/bilirubin|creatinine|uric|cholesterol|triglyceride|hdl|ldl|vldl|glucose|fbs|rbs|sugar/.test(name)) return "mg/dL";
                if (/t3|t4|tsh/.test(name)) return "µIU/mL";
                if (/sgpt|sgot|ggt|phosphate/.test(name)) return "U/L";
                if (sectionTitle === "RUA Group") return "-";
                return "%";

            const sampleTableValue = (section, row, index) => {
                // Keep two visibly out-of-range CBC examples in the prototype.
                if (section.title === "CBC Group" && row.id === "hemoglobin") return "120";
                if (section.title === "CBC Group" && row.id === "rbc") return "0";
                if (row.fieldType === "dropdown" || row.masterKey) {
                    return (otherMedicalMasterOptions[row.masterKey] ?? otherMedicalMasterOptions.VALUE)[0]?.value ?? "";

                        <div class="test-parameter-name">${esc(row.parameter)}${required}${conditional}</div>
                        <div>${tableValueMarkup(section, row, "value", value)}</div>
                        <div class="table-normal-range">

                            ${tableValueMarkup(section, row, "labEnd", "100")}
                        </div>
                        <div class="table-readonly" data-table-unit="${esc(row.id)}">${esc(sampleUnit(row.parameter, section.title))}</div>
                        <div class="table-readonly" data-table-status="${esc(row.id)}">Normal</div>
                        <div class="status-indicator status-normal" data-table-indicator="${esc(row.id)}" aria-label="Normal"><span aria-hidden="true"></span></div>
                    </div>`;
                }).join("");

                return `<section class="test-parameter-section" data-parameter-section="${esc(section.title)}">
                    <h3 class="test-parameter-title">${esc(section.tableTitle)}</h3>
                    <div class="test-parameter-table-wrap">

                        </div>
                        ${rows}

                </section>`;
            };

            const formDemoValue = (field, section, sectionIndex) => {
                const numericBase = 90 + sectionIndex;
                switch (field.id) {
                    case "medicalType": return section.title;
                    case "date":
                    case "testDate": return "2026-09-18";
                    case "value":
                        return field.type === "dropdown" ? "NEGATIVE" : String(numericBase);
                    case "findings":
                        return field.editable === false ? "Normal" : String(12 + sectionIndex);
                    case "result": return "Normal";
                    case "examineeName": return "Rudra Prakash Sangha";
                    case "examineeAge": return "38";
                    case "examineeGender": return "M";

                    case "labRangeValueStart": return "70";

                    default: return "";

            const moveLabRangeFieldsIntoTable = (card, section) => {
                const labFieldIds = ["value", "labRangeValueStart", "labRangeValueEnd", "unitsValue", "findings"];
                const labFields = labFieldIds
                    .map((fieldId) => findControl(card, fieldId)?.closest(".field"))
                    .filter(Boolean);

                if (labFields.length !== labFieldIds.length || card.querySelector(".lab-range-table")) return;

                const table = document.createElement("section");
                table.className = "lab-range-table";
                table.setAttribute("aria-label", `${section.title} lab result`);

                const row = table.querySelector(".lab-range-table-row");

            const applyOtherMedicalPrototype = () => {
            otherMedicalSectionsFromTypeScript.forEach((section, sectionIndex) => {
                const card = document.getElementById(`g2s${sectionIndex}`);
                if (!card) return;
                const body = card.querySelector(".card-body");

                section.fields.forEach((field) => {
                    const control = findControl(card, field.id);
                    if (!control) return;
                    if (field.validation) control.dataset.validation = field.validation;
                    if (control.tagName !== "SELECT") return;

                    if (field.masterKey === "MEDICAL_TYPE") {
                        setSelectOptions(control, [{ value: section.title, label: section.title }], section.title);
                    } else {
                        setSelectOptions(
                            control,
                            otherMedicalMasterOptions[field.masterKey] ?? otherMedicalMasterOptions.VALUE,
                            formDemoValue(field, section, sectionIndex),
                        );
                    }
                });

                section.fields.forEach((field) => {
                    setControlValue(card, field.id, formDemoValue(field, section, sectionIndex));
                });

                if (section.tableRows.length) {
                    const fieldGrid = document.createElement("div");
                    fieldGrid.className = "other-medical-fields-grid";
                    Array.from(body.children).forEach((child) => fieldGrid.append(child));
                    body.classList.add("other-medical-with-table");
                    body.append(fieldGrid);
                    body.insertAdjacentHTML("beforeend", renderParameterTable(section));
                } else if (section.fields.some((field) => field.id === "labRangeValueStart")) {
                    moveLabRangeFieldsIntoTable(card, section);
                }
            });
            };

            window.applyOtherMedicalPrototype = applyOtherMedicalPrototype;
            applyOtherMedicalPrototype();

            document.querySelectorAll(".medical-content .card").forEach((card) => {
                card.dataset.edit = "0";
                card.querySelector(".card-body")?.dispatchEvent(new Event("change", { bubbles: true }));

            const firstRenderedCard = document.querySelector(".medical-content .card");
            if (firstRenderedCard) setActive(firstRenderedCard.id);
