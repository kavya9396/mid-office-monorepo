    <script id="typescript-authoritative-medical-render">
        (() => {
            const specialSections = window.specialMedicalSectionsFromTypeScript ?? [];
            const otherSections = window.otherMedicalSectionsFromTypeScript ?? [];

            const readMedicalControlValue = (control) => {
                if (!control) return "";
                if (control.tagName === "SELECT" || control.tagName === "INPUT") return control.value;
                return control.textContent.trim() === "-" ? "" : control.textContent.trim();
            };

            const preservedValues = {};
            document.querySelectorAll(".medical-content .card").forEach((card) => {
                preservedValues[card.id] = Array.from(card.querySelectorAll("[data-field]")).map(
                    (control) => ({
                        fieldId: control.dataset.field,
                        value: readMedicalControlValue(control),
                    }),
                );
            });

            medicalGroups[1].items = specialSections.map((section) => [
                section.title,
                section.fields,
            ]);
            medicalGroups[2].items = otherSections.map((section) => [
                section.title,
                section.fields,
            ]);

            // Render once from the authoritative arrays so the original compact
            // demo definitions can never become the visible fallback.
            renderMedical();
            window.applySpecialMedicalPrototype?.(true);
            window.applyOtherMedicalPrototype?.();

            const restoreMedicalControlValue = (card, fieldId, value) => {
                const control = Array.from(card.querySelectorAll("[data-field]")).find(
                    (element) => element.dataset.field === fieldId,
                );
                if (!control) return;

                if (control.tagName === "SELECT") {
                    const normalizedValue = String(value ?? "").trim().toLowerCase();
                    let option = Array.from(control.options).find(
                        (item) =>
                            String(item.value).trim().toLowerCase() === normalizedValue ||
                            String(item.text).trim().toLowerCase() === normalizedValue,
                    );
                    if (!option && value !== "" && value != null) {
                        option = new Option(String(value), String(value));
                        control.add(option);
                    }
                    control.value = option ? option.value : "";
                    return;
                }

                if (control.tagName === "INPUT") {
                    control.value = value ?? "";
                    return;
                }

                control.textContent = value === "" || value == null ? "-" : String(value);
            };

            Object.entries(preservedValues).forEach(([cardId, values]) => {
                const card = document.getElementById(cardId);
                if (!card) return;
                values.forEach(({ fieldId, value }) =>
                    restoreMedicalControlValue(card, fieldId, value),
                );
            });

            document.querySelectorAll(".medical-content .card").forEach((card) => {
                card.dataset.edit = "0";
                card.querySelector(".card-body")?.dispatchEvent(
                    new Event("change", { bubbles: true }),
                );
            });

            const medicalNav = document.getElementById("medical-nav");
            const medicalContent = document.getElementById("medical-content");
            const groupElements = Array.from(medicalNav.children);

            const tools = document.createElement("div");
            medicalNav.prepend(tools);

            const getSectionDetail = (groupIndex, sectionIndex) => {
                if (groupIndex === 1) {
                    const section = specialSections[sectionIndex];
                    return {
                        fieldCount: section?.fields.length ?? 0,
                        parameterCount: 0,
                    };
                }
                if (groupIndex === 2) {
                    const section = otherSections[sectionIndex];
                    return {
                        fieldCount: section?.fields.length ?? 0,
                        parameterCount: section?.tableRows.length ?? 0,
                    };
                }
                return {
                    fieldCount: medicalGroups[groupIndex]?.items[sectionIndex]?.[1]?.length ?? 0,
                    parameterCount: 0,
                };
            };

            groupElements.forEach((groupElement, groupIndex) => {
                const groupConfig = medicalGroups[groupIndex];
                const groupButton = groupElement.querySelector(".group");
                const list = groupElement.querySelector(".g-items");
                if (!groupButton || !list || !groupConfig) return;

                groupButton.innerHTML = "";
                const groupName = document.createElement("span");
                groupName.textContent = groupConfig.name;
                const groupMeta = document.createElement("span");
                groupMeta.className = "group-meta";
                const groupCount = document.createElement("span");
                groupCount.className = "group-count";
                // groupCount.textContent = String(groupConfig.items.length);
                const chevron = document.createElement("span");
                chevron.textContent = "⌄";
                groupMeta.append(groupCount, chevron);
                groupButton.append(groupName, groupMeta);

                Array.from(list.querySelectorAll(".nav-item")).forEach((navItem, sectionIndex) => {
                    const sectionTitle = groupConfig.items[sectionIndex][0];
                    const detail = getSectionDetail(groupIndex, sectionIndex);
                    const countText = detail.parameterCount
                        ? `${detail.fieldCount}+${detail.parameterCount}`
                        : String(detail.fieldCount);
                    const countLabel = detail.parameterCount
                        ? `${detail.fieldCount} fields and ${detail.parameterCount} parameters`
                        : `${detail.fieldCount} fields`;
                    const titleSpan = navItem.querySelector("span:first-child");
                    const countSpan = navItem.querySelector("span:last-child");
                    if (titleSpan) titleSpan.textContent = sectionTitle;
                    // if (countSpan) {
                    //     countSpan.className = "nav-field-count";
                    //     countSpan.textContent = countText;
                    // }
                    navItem.title = `${sectionTitle} — ${countLabel}`;
                    navItem.dataset.searchText = sectionTitle.toLowerCase();
                });
            });

            // Keep the requested groups immediately available while reducing
            // the space used by MER in the long 40-subsection navigation.
            groupElements[0]?.querySelector(".g-items")?.classList.remove("hidden");
            groupElements[1]?.querySelector(".g-items")?.classList.remove("hidden");
            groupElements[2]?.querySelector(".g-items")?.classList.remove("hidden");

            tools.querySelector("[data-nav-expand]").onclick = () => {
                groupElements.forEach((group) =>
                    group.querySelector(".g-items")?.classList.remove("hidden"),
                );
            };
            tools.querySelector("[data-nav-collapse]").onclick = () => {
                groupElements.forEach((group) =>
                    group.querySelector(".g-items")?.classList.add("hidden"),
                );
            };

            const searchInput = tools.querySelector(".medical-nav-search");
            searchInput.addEventListener("input", () => {
                const query = searchInput.value.trim().toLowerCase();
                groupElements.forEach((group) => {
                    const list = group.querySelector(".g-items");
                    const items = Array.from(group.querySelectorAll(".nav-item"));
                    let visibleCount = 0;
                    items.forEach((item) => {
                        const visible = !query || item.dataset.searchText.includes(query);
                        item.hidden = !visible;
                        if (visible) visibleCount += 1;
                    });
                    group.hidden = Boolean(query) && visibleCount === 0;
                    if (query && visibleCount) list?.classList.remove("hidden");
                });
            });

            const normalizeLabel = (label) => {
                const clone = label.cloneNode(true);
                clone.querySelectorAll(".required, .conditional-note").forEach((mark) => mark.remove());
                return clone.textContent.replace(/\s+/g, " ").trim();
            };

            const auditFailures = [];
            const auditSection = (groupIndex, sectionIndex, section) => {
                const card = document.getElementById(`g${groupIndex}s${sectionIndex}`);
                if (!card) {
                    auditFailures.push(`${section.title}: card missing`);
                    return;
                }

                const actualFields = Array.from(card.querySelectorAll(".field > label")).map(
                    normalizeLabel,
                );
                const expectedFields = section.fields.map((field) => field.label);
                if (JSON.stringify(actualFields) !== JSON.stringify(expectedFields)) {
                    auditFailures.push(
                        `${section.title}: expected ${expectedFields.length} fields, rendered ${actualFields.length}`,
                    );
                }

                const parameterCount = section.tableRows?.length ?? 0;
                if (parameterCount) {
                    const actualParameters = Array.from(
                        card.querySelectorAll(
                            ".test-parameter-row:not(.test-parameter-head) .test-parameter-name",
                        ),
                    ).map(normalizeLabel);
                    const expectedParameters = section.tableRows.map((row) => row.parameter);
                    if (JSON.stringify(actualParameters) !== JSON.stringify(expectedParameters)) {
                        auditFailures.push(
                            `${section.title}: expected ${expectedParameters.length} parameters, rendered ${actualParameters.length}`,
                        );
                    }
                }

                const oldBadge = card.querySelector(".section-count-badge");
                oldBadge?.remove();
                const badge = document.createElement("span");
                badge.className = "section-count-badge";
                badge.textContent = parameterCount
                    ? `${expectedFields.length} fields + ${parameterCount} parameters`
                    : `${expectedFields.length} fields`;
                card.querySelector(".card-head")?.insertBefore(
                    badge,
                    card.querySelector(".card-actions"),
                );
                card.dataset.validatedFieldCount = String(expectedFields.length);
                if (parameterCount) {
                    card.dataset.validatedParameterCount = String(parameterCount);
                }
            };

            specialSections.forEach((section, index) => auditSection(1, index, section));
            otherSections.forEach((section, index) => auditSection(2, index, section));

            const oldStatus = document.getElementById("medical-config-status");
            oldStatus?.remove();
            const status = document.createElement("div");

<script id="other-medical-result-status-script">
    (() => {
        const medicalContent = document.getElementById("medical-content");
        if (!medicalContent) return;

        const numberValue = (control) => {
            if (!control) return NaN;
            const rawValue = control.tagName === "INPUT" || control.tagName === "SELECT"
                ? control.value
                : control.textContent;
            return Number.parseFloat(String(rawValue).replace(/,/g, ""));
        };

        const updateResultStatus = (card, rowId) => {
            const value = numberValue(card.querySelector(`[data-table-row="${rowId}"][data-table-column="value"]`));
            const rangeStart = numberValue(card.querySelector(`[data-table-row="${rowId}"][data-table-column="labStart"]`));
            const rangeEnd = numberValue(card.querySelector(`[data-table-row="${rowId}"][data-table-column="labEnd"]`));
            const status = card.querySelector(`[data-table-status="${rowId}"]`);
            const indicator = card.querySelector(`[data-table-indicator="${rowId}"]`);
            if (!status || !Number.isFinite(value) || !Number.isFinite(rangeStart) || !Number.isFinite(rangeEnd)) return;

            const isNormal = value >= Math.min(rangeStart, rangeEnd) && value <= Math.max(rangeStart, rangeEnd);
            status.textContent = isNormal ? "Normal" : "Abnormal";
            status.classList.toggle("status-normal", isNormal);
            status.classList.toggle("status-abnormal", !isNormal);
            if (indicator) {
                indicator.classList.toggle("status-normal", isNormal);
                indicator.classList.toggle("status-abnormal", !isNormal);
                indicator.setAttribute("aria-label", isNormal ? "Normal" : "Abnormal");
            }
        };

        const updateAllResultStatuses = () => {
            medicalContent.querySelectorAll(".card").forEach((card) => {
                card.querySelectorAll("[data-table-status]").forEach((status) =>
                    updateResultStatus(card, status.dataset.tableStatus),
                );
            });
        };

        medicalContent.addEventListener("input", (event) => {
            const control = event.target.closest("[data-table-row]");
            const card = control?.closest(".card");
            if (control && card) updateResultStatus(card, control.dataset.tableRow);
        });
        medicalContent.addEventListener("change", (event) => {
            const control = event.target.closest("[data-table-row]");
            const card = control?.closest(".card");
            if (control && card) updateResultStatus(card, control.dataset.tableRow);
        });
        updateAllResultStatuses();
    })();
</script>

    // MER, TELE-VIDEO MER, Special Medicals, then Other Medicals.
    const specialMedicalGroup = navigation.querySelector('[data-group="1"]')?.parentElement;
    navigation.insertBefore(group, specialMedicalGroup || navTools || navigation.lastElementChild);
    const teleCards = [];
    const syncTeleQuestionRemarks = (card) => {
        card.querySelectorAll('[data-question-remark-for]').forEach((remark) => {
            const response = card.querySelector(`[data-field="${remark.dataset.questionRemarkFor}"]`);
            const required = String(response?.value || '').trim().toLowerCase() === 'y' || String(response?.value || '').trim().toLowerCase() === 'yes';
            remark.classList.toggle('question-remark-required', required);
            remark.required = required;
            let mark = remark.closest('.question-table-control')?.querySelector('.question-remark-mark');
            if (required && !mark) remark.insertAdjacentHTML('afterend', '<span class="required question-remark-mark" aria-label="Remarks required">*</span>');
            if (!required && mark) mark.remove();
        });
    };
    const syncTeleSubQuestions = (card) => {
        card.querySelectorAll('.question-sub-question').forEach((row) => {
            const parent = card.querySelector(`[data-field="${row.dataset.parentQuestion}"]`);
            const isYes = String(parent?.value || '').trim().toUpperCase() === 'Y' || String(parent?.value || '').trim().toUpperCase() === 'YES';
            row.hidden = !isYes;
        });
    };
    const teleFamilyRelationOptions = ["Father", "Mother", "Brother", "Sister", "Spouse", "Son", "Daughter", "Grandfather", "Grandmother", "Other"];
    const teleFamilyRelationSelect = (fieldId, value = "", disabled = true) => `<select data-field="${esc(fieldId)}" data-field-type="dropdown" data-editable="1" data-family-relation="1" ${disabled ? "disabled" : ""}><option value="">Select</option>${teleFamilyRelationOptions.map((relation) => `<option value="${esc(relation)}" ${relation.toLowerCase() === String(value).toLowerCase() ? "selected" : ""}>${esc(relation)}</option>`).join("")}</select>`;
    const teleFamilyDeadAliveSelect = (fieldId, value = "", disabled = true) => `<select data-field="${esc(fieldId)}" data-field-type="dropdown" data-editable="1" ${disabled ? "disabled" : ""}><option value="">Select</option><option value="ALIVE" ${String(value).toUpperCase() === "ALIVE" ? "selected" : ""}>Alive</option><option value="DEAD" ${String(value).toUpperCase() === "DEAD" ? "selected" : ""}>Dead</option></select>`;
    const teleFamilyHistoryRow = (rowId, relation = "", age = "", healthStatus = "", deadAlive = "", editing = false, isAdded = false) => `<tr${isAdded ? ' data-added-row="1"' : ''}>
        <td>${teleFamilyRelationSelect(`${rowId}-relation`, relation, !editing)}</td>
        <td>${editing ? `<input type="number" data-field="${rowId}-age" data-field-type="number" data-editable="1" value="${esc(age)}" />` : `<div class="value" data-field="${rowId}-age" data-field-type="number" data-editable="1">${escValue(age)}</div>`}</td>
        <td>${teleFamilyDeadAliveSelect(`${rowId}-dead-alive`, deadAlive, !editing)}</td>
        <td>${editing ? `<input type="text" data-field="${rowId}-health-status" data-field-type="text" data-editable="1" value="${esc(healthStatus)}" />` : `<div class="value" data-field="${rowId}-health-status" data-field-type="text" data-editable="1">${escValue(healthStatus)}</div>`}</td>
        <td><button class="family-history-delete" type="button" aria-label="Delete family history record" title="Delete record">×</button></td>
    </tr>`;
    const teleFamilyHistoryMarkup = () => `<div class="card-body family-history-body"><div class="family-history-actions"><label for="tele-family-add-relation">Relation:</label><select id="tele-family-add-relation" data-family-add-relation disabled><option value="">Select a relation</option>${teleFamilyRelationOptions.map((relation) => `<option value="${esc(relation)}">${esc(relation)}</option>`).join('')}</select><button class="smallbtn family-history-add" type="button">Add</button></div><table class="family-history-table"><thead><tr><th>Relation Type</th><th>Age</th><th>Dead or alive</th><th>Health Status</th><th>Action</th></tr></thead><tbody>${teleFamilyHistoryRow("tele-family-father", "Father", "55", "GOOD", "ALIVE")}${teleFamilyHistoryRow("tele-family-mother", "Mother", "51", "GOOD", "ALIVE")}</tbody></table></div>`;
    const addCard = (title, markup) => {
        const id = `tele-video-mer-${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
        const navButton = document.createElement('button');
        navButton.type = 'button'; navButton.className = 'nav-item'; navButton.dataset.target = id;
        navButton.innerHTML = `<span>${esc(title)}</span><span>›</span>`;
        groupList.append(navButton);
        const card = document.createElement('article'); card.className = 'card'; card.id = id;
        card.innerHTML = `<header class="card-head"><button class="card-title" type="button">⌄ &nbsp; ${esc(title)}</button><div class="card-actions"><button class="smallbtn reset hidden" data-reset="${id}" type="button">Reset</button><button class="smallbtn" data-edit="${id}" type="button">Edit</button></div></header>${markup}`;
        const decision = document.getElementById('medical-decision-section');
        content.insertBefore(card, decision || null);
        teleCards.push(card);
        navButton.addEventListener('click', () => { card.scrollIntoView({behavior:'smooth', block:'start'}); window.setActive?.(id); });
        card.querySelector('.card-title').addEventListener('click', () => card.querySelector('.card-body').classList.toggle('hidden'));
        const edit = card.querySelector('.card-actions .smallbtn:not(.reset)');
        const reset = card.querySelector('.reset');
        let familyRowsSnapshot = '';
        edit.addEventListener('click', () => {
            if (title === 'Family History' && card.dataset.edit !== '1') familyRowsSnapshot = card.querySelector('tbody')?.innerHTML || '';
            window.editCard?.(id, edit);
        });
        reset.addEventListener('click', () => {
            window.resetCard?.(id);
            if (title === 'Family History') {
                const body = card.querySelector('.family-history-body');
                if (body && familyRowsSnapshot) body.querySelector('tbody').innerHTML = familyRowsSnapshot;
                const addRelation = body?.querySelector('[data-family-add-relation]');
                if (addRelation) { addRelation.value = ''; addRelation.disabled = true; }
            }
        });
        card.querySelector('.card-body').addEventListener('change', () => {
            syncTeleQuestionRemarks(card);
            syncTeleSubQuestions(card);
        });
    };
    const habitAndAddictionMarkup = () => {
        const habits = [
            ['Cigarette/beedis/cigar', 'YES', '2', '10'],
            ['Gutka/Snuff/Paan etc.', 'NO', '', ''],
            ['Narrotic Consumption', 'NO', '', ''],
            ['Beer/Wine/Hard liquor', 'YES', '4', '12']
        ];
        return `<div class="card-body" style="display:block;padding:0"><table class="habit-addiction-table"><thead><tr><th></th><th>INDICATOR</th><th>QUANTITY</th><th>NO. OF YEAR</th></tr></thead><tbody>${habits.map(([habit, indicator, quantity, years], index) => `<tr><td>${esc(habit)}</td><td><select data-field="tele-habit-${index}-indicator" data-field-type="dropdown" data-editable="1" disabled><option value="">--Select--</option><option value="YES" ${indicator === 'YES' ? 'selected' : ''}>Yes</option><option value="NO" ${indicator === 'NO' ? 'selected' : ''}>No</option></select></td><td><div class="value" data-field="tele-habit-${index}-quantity" data-editable="1" data-field-type="number">${escValue(quantity)}</div></td><td><div class="value" data-field="tele-habit-${index}-years" data-editable="1" data-field-type="number">${escValue(years)}</div></td></tr>`).join('')}</tbody></table></div>`;
    };
    const dispositionSection = teleSections.find(([title]) => title === 'Disposition Details');
    teleSections.filter(([title]) => title !== 'Disposition Details').forEach(([title, fields]) => addCard(title, title === "Family History"
        ? teleFamilyHistoryMarkup()
        : title === 'Habit and Addiction'
            ? habitAndAddictionMarkup()
            : `<div class="card-body">${fields.map(([label, value], i) => `<div class="field"><label>${esc(label)}</label><div class="value" data-field="tele-${title}-${i}" data-editable="1" data-field-type="text">${escValue(value)}</div></div>`).join('')}</div>`));
    content.querySelectorAll('#tele-video-mer-family-history .family-history-body').forEach((body) => {
        body.addEventListener('change', (event) => {
            if (!event.target.matches('[data-family-relation]') || !event.target.value) return;
            const duplicates = Array.from(body.querySelectorAll('[data-family-relation]')).filter((control) => control.value.toLowerCase() === event.target.value.toLowerCase());
            if (duplicates.length > 1) {
                event.target.value = '';
                toast('This relation is already added. Please choose a different relation.');
            }
        });
        body.addEventListener('click', (event) => {
            const deleteButton = event.target.closest('.family-history-delete');
            if (deleteButton) {
                if (body.closest('.card')?.dataset.edit !== '1') {
                    toast('Select Edit before deleting a family history record.');
                    return;
                }
                deleteButton.closest('tr')?.remove();
                return;
            }
            if (!event.target.closest('.family-history-add')) return;
            const card = body.closest('.card');
            if (card.dataset.edit !== '1') {
                toast('Select Edit before adding a family history record.');
                return;
            }
            const relationInput = body.querySelector('[data-family-add-relation]');
            const relation = relationInput?.value || '';
            if (!relation) {
                toast('Select a relation before adding a record.');
                return;
            }
            const selected = new Set(Array.from(body.querySelectorAll('[data-family-relation]')).map((control) => control.value).filter(Boolean));
            if (selected.has(relation)) {
                toast('This relation is already added. Please choose a different relation.');
                return;
            }
            body.querySelector('tbody').insertAdjacentHTML('beforeend', teleFamilyHistoryRow(`tele-family-extra-${Date.now()}`, relation, '', '', '', true, true));
            relationInput.value = '';
        });
    });
    addCard('Question Table', `<div class="card-body question-table"><div class="question-table-head"><span>Question Id</span><span>Question</span><span>Response</span><span>Remarks</span></div>${teleQuestions.map(([id, label, value], i) => {
        const normalized = String(value).toLowerCase();
        const selected = normalized === 'yes' ? 'Y' : normalized === 'no' ? 'N' : '';
        const rootId = String(id).split('.')[0];
        const parentIndex = teleQuestions.findIndex(([questionId]) => String(questionId) === rootId);
        const isSubQuestion = String(id).includes('.');
        return `<div class="question-table-row${isSubQuestion ? ' question-sub-question' : ''}"${isSubQuestion ? ` data-parent-question="tele-question-${parentIndex}"` : ''}><div class="question-table-id">${esc(id)}</div><div class="question-table-label">${esc(label)}</div><div class="question-table-control"><select data-field="tele-question-${i}" data-field-type="dropdown" data-editable="1" disabled><option value="">Select</option><option value="Y" ${selected === 'Y' ? 'selected' : ''}>Yes</option><option value="N" ${selected === 'N' ? 'selected' : ''}>No</option></select></div><div class="question-table-control"><div class="value" data-field="tele-question-${i}-remarks" data-field-type="text" data-editable="1" data-question-remark-for="tele-question-${i}">-</div></div></div>`;
    }).join('')}</div>`);
    if (dispositionSection) {
        const [title, fields] = dispositionSection;
        addCard(title, `<div class="card-body">${fields.map(([label, value], i) => `<div class="field"><label>${esc(label)}</label><div class="value" data-field="tele-${title}-${i}" data-editable="1" data-field-type="text">${escValue(value)}</div></div>`).join('')}</div>`);
    }
    document.querySelectorAll('#tele-video-mer-question-table').forEach(syncTeleSubQuestions);
    // The core renderer creates Special and Other Medicals first. Move the
    // completed TELE-VIDEO MER cards as one block directly after MER.
    const firstSpecialMedicalCard = document.getElementById('g1s0');
    teleCards.forEach(card => content.insertBefore(card, firstSpecialMedicalCard || null));
    group.querySelector('.group').addEventListener('click', () => groupList.classList.toggle('hidden'));
})();
</script>
</body>

</html>
