<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICICI Life | Application Summary</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #fff;
    }

    body {
      margin: 0;
      color: #1f2937;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app-header {
      height: 57px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: stretch;
      overflow: visible;
      background: linear-gradient(to bottom, #F58220 0%, #E65318 42%, #C92E27 72%, #98252B 100%);
      box-shadow: 0 3px 12px rgba(111, 24, 24, .25);
    }

    .header-back {
      width: 42px;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      background: rgba(126, 22, 31, .42);
      font-size: 26px;
      cursor: pointer;
    }

    .header-back:hover {
      background: rgba(126, 22, 31, .62);
    }

    .brand {
      width: 150px;
      height: 57px;
      object-fit: cover;
      display: block;
    }

    .header-user {
      min-width: 0;
      flex: 1;
      padding: 0 32px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      color: #fff;
    }

    .session {
      min-width: 175px;
      padding-right: 12px;
      text-align: right;
      border-right: 1px solid rgba(255, 255, 255, .35);
      color: rgba(255, 255, 255, .9);
      font-size: 12px;
      line-height: 1.4;
    }

    .session strong {
      display: block;
      margin-top: 3px;
      color: #fff;
      font-size: 11px;
      letter-spacing: .2px;
    }

    .profile-trigger {
      margin-left: 20px;
      padding: 4px 8px;
      border: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }

    .profile-trigger:hover {
      background: rgba(255, 255, 255, .14);
    }

    .profile-circle {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      font-size: 20px;
    }

    .profile-name {
      min-width: 80px;
      margin: 0 8px 0 10px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
    }

    .chevron {
      font-size: 18px;
    }

    .user-menu {
      display: none;
      position: absolute;
      right: 16px;
      top: 65px;
      z-index: 30;
      width: 240px;
      overflow: hidden;
      border: 1px solid #F1D7D0;
      border-radius: 8px;
      color: #323232;
      background: #fff;
      box-shadow: 0 8px 24px rgba(70, 20, 20, .18);
    }

    .user-menu.open {
      display: block;
    }

    .menu-row {
      padding: 15px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .menu-row:hover {
      background: #FFF3EE;
    }

    .menu-row+.menu-row {
      border-top: 1px solid #e0e0e0;
    }

    .menu-row span:first-child {
      color: #9A2529;
      font-size: 14px;
    }

    .page {
      width: 100%;
      padding: 6px 8px 30px;
    }

    .main-button {
      min-height: 28px;
      padding: 4px 11px;
      border: 1px solid #E45F14;
      border-radius: 5px;
      color: #E45F14;
      background: #fff;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .financial-search {
      margin-top: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid #E4E7EC;
      border-radius: 6px;
      background: #F8FAFC;
    }

    .financial-search-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .financial-search select,
    .financial-search input {
      height: 34px;
      padding: 6px 10px;
      border: 1px solid #CBD0D7;
      border-radius: 6px;
      outline: none;
      color: #344054;
      background: #fff;
      font-size: 12px;
    }

    .financial-search select {
      width: 130px;
    }

    .financial-search input {
      width: 280px;
    }

    .financial-search select:focus,
    .financial-search input:focus {
      border-color: #E45F14;
    }

    .financial-search button {
      height: 34px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #financial-search-button {
      border: 0;
      color: #fff;
      background: #9A2529;
    }

    #financial-search-button:hover {
      background: #8F2026;
    }

    .financial-search-clear {
      border: 1px solid #9A2529;
      color: #9A2529;
      background: #fff;
    }

    .financial-search-clear:hover {
      color: #fff;
      background: #9A2529;
    }

    /* Highlight searched financial section */
    .financial-card.search-highlight {
      border: 2px solid #E45F14;
      box-shadow: 0 0 0 3px rgba(228, 95, 20, 0.12);
      animation: financialHighlight 1.2s ease;
    }

    @keyframes financialHighlight {
      0% {
        box-shadow: 0 0 0 6px rgba(228, 95, 20, 0.25);
      }

      100% {
        box-shadow: 0 0 0 3px rgba(228, 95, 20, 0.12);
      }
    }

    .financial-field.search-field-highlight {
      padding: 6px;
      border: 2px solid #E45F14;
      border-radius: 8px;
      background: #FFF8F3;
    }

    .financial-shell {
      display: none;
      margin-top: 8px;
    }

    .financial-shell.visible {
      display: grid;
      align-items: center;
      column-gap: 20px;
      row-gap: 15px;
      margin-top: 15px;
    }

    .financial-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .financial-person-switcher {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
    }

    .financial-topbar {
      grid-column: 1;
      grid-row: 1;
    }

    .financial-person-switcher {
      grid-column: 2;
      grid-row: 1;
    }

    .financial-layout,
    .financial-submit {
      grid-column: 1 / -1;
    }

    .financial-shared-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #E45F14;
      border-radius: 50%;
      color: #9A2529;
      background: #FFF4EC;
      font-size: 12px;
      font-weight: 800;
    }

    .financial-tabs {
      display: flex;
      align-items: flex-end;
      gap: 18px;
    }

    .financial-tab {
      padding: 5px 2px 7px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: #667085;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .financial-tab:hover {
      color: #9A2529;
    }

    .financial-tab.active {
      border-bottom-color: #E45F14;
      color: #9A2529;
      font-weight: 800;
    }

    .financial-back {
      padding: 5px 11px;
      border: 1px solid #E45F14;
      border-radius: 18px;
      color: #A92129;
      background: #FFF4EC;
      box-shadow: 0 2px 7px rgba(169, 33, 41, .12);
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .documents-link {
      padding: 5px 8px;
      border: 0;
      color: #9A2529;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    .financial-layout {
      width: 100%;
      margin-top: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .financial-nav {
      width: 280px;
      min-width: 280px;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      border: 1px solid #D6D8DC;
      border-radius: 4px;
      background: #F8F9FB;
    }

    .financial-nav button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid #EAECEF;
      border-left: 3px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: #667085;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
    }

    .financial-nav button.active {
      border-left-color: #DE2C3B;
      color: #B42318;
      background: #fff;
      font-weight: 600;
    }

    .financial-content {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .financial-card {
      scroll-margin-top: 75px;
      overflow: hidden;
      border: 1px solid #E4E7EC;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .08);
    }

    .financial-card-head {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #E4E7EC;
      background: #F8FAFC;
    }

    .financial-card-head h3 {
      margin: 0;
      color: #1F2937;
      font-size: 16px;
      font-weight: 700;
    }

    .financial-card-actions {
      display: flex;
      gap: 8px;
    }

    .financial-edit {
      min-width: 80px;
      padding: 5px 10px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: #9A2529;
      font-size: 13px;
      cursor: pointer;
    }

    .financial-edit:hover {
      background: #8f2026;
    }

    .financial-reset {
      min-width: 80px;
      padding: 5px 10px;
      border: 1px solid #9A2529;
      border-radius: 4px;
      color: #9A2529;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .financial-card-body {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(var(--columns, 3), minmax(0, 1fr));
      gap: 10px;
    }

    .financial-field label {
      margin: 0 0 4px;
      display: flex;
      gap: 2px;
      color: #475467;
      font-size: 12px;
    }

    .required {
      color: #B42318;
      font-weight: 700;
    }

    .financial-field input,
    .financial-field select {
      width: 100%;
      min-height: 38px;
      padding: 7.6px 10px;
      border: 1px solid #E4E7EC;
      border-radius: 8px;
      outline: none;
      color: #344054;
      background: #EFF1F3;
      font-size: 13px;
    }

    .financial-field input[readonly],
    .financial-field select:disabled {
      min-height: 38px;
      padding: 7.6px 10px;
      border: 1px solid #E4E7EC;
      border-radius: 8px;
      color: #344054;
      background: #EFF1F3;
      cursor: default;
      outline: none;
    }

    /* No visual focus effect in read-only state */
    .financial-field input[readonly]:focus,
    .financial-field select:disabled:focus {
      border-color: #E4E7EC;
      outline: none;
      box-shadow: none;
    }

    .financial-readonly {
      width: 100%;
      min-height: 38px;
      padding: 7.6px 10px;
      border-radius: 8px;
      background: #EFF1F3;
      border: 1px solid #E4E7EC;
      color: #344054;
      font-size: 13px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
      cursor: default;
      user-select: text;
    }

    .financial-editable {
      width: 100%;
      min-height: 38px;
      padding: 7.6px 10px;
      border: 1px solid #CBD0D7;
      border-radius: 8px;
      outline: none;
      color: #344054;
      background: #fff;
      font-size: 13px;
    }

    .financial-editable:focus {
      border-color: #9A2529;
    }

    /* Editable state */
    .financial-field input:not([readonly]),
    .financial-field select:not(:disabled) {
      background: #fff;
      border: 1px solid #CBD0D7;
      cursor: text;
    }

    .financial-field input:not([readonly]):focus,
    .financial-field select:not(:disabled):focus {
      border-color: #9A2529;
      outline: none;
      box-shadow: none;
    }

    /* CUW review actions use the same green/red outline and selected states as ViewFinancial.tsx. */
    .financial-review-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #E4E7EC;
      background: #FCFCFD;
    }

    .financial-review-button {
      min-width: 90px;
      padding: 5px 12px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .financial-review-button.agree {
      color: #027A48;
    }

    .financial-review-button.disagree {
      color: #B42318;
    }

    .financial-review-button.agree[aria-pressed="true"] {
      color: #fff;
      background: #027A48;
    }

    .financial-review-button.disagree[aria-pressed="true"] {
      color: #fff;
      background: #B42318;
    }

    .financial-review-button.agree:hover {
      border-color: #05603A;
    }

    .financial-review-button.disagree:hover {
      border-color: #912018;
    }

    .financial-submit {
      padding: 16px;
      display: flex;
      justify-content: flex-end;
      border-radius: 8px;
      background: #fff;
    }

    .financial-submit .main-button {
      min-width: 110px;
      border: 0;
      border-radius: 50px;
      color: #fff;
      background: #9A2529;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      display: none;
      padding: 12px 16px;
      border-radius: 6px;
      color: #fff;
      background: #027A48;
      box-shadow: 0 4px 14px rgba(16, 24, 40, .25);
      font-size: 13px;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 800px) {
      .header-user {
        padding: 0 8px;
      }

      .session,
      .profile-name {
        display: none;
      }

      .financial-layout {
        flex-direction: column;
      }

      .financial-shell.visible {
        grid-template-columns: 1fr;
        row-gap: 8px;
      }

      .financial-topbar,
      .financial-person-switcher,
      .financial-layout,
      .financial-submit {
        grid-column: 1;
      }

      .financial-person-switcher {
        grid-row: 2;
      }

      .financial-nav {
        width: 100%;
        min-width: 0;
        max-height: 260px;
      }

      .financial-card-body {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      .brand {
        width: 128px;
      }

      .financial-card-body {
        grid-template-columns: 1fr;
      }

      .documents-link {
        min-width: 0;
        font-size: 11px;
      }
    }
  </style>
</head>

            <button class="financial-tab" type="button" role="tab" aria-selected="false"

          </div>
        </div>

        <button class="documents-link" id="documents-link">View Financial Documents</button>

      </div>

      <div class="financial-search" id="financial-search">
        <div class="financial-search-group">
          <!-- Search By control intentionally hidden: financial search now always matches section names.
          <select id="financial-search-field" aria-label="Search field">
            <option value="">Search by</option>
            <option value="section">Section</option>
            <option value="field">Field</option>
          </select> -->

          <input type="text" id="financial-search-input" placeholder="Search financial section..." autocomplete="off" />

          <button type="button" id="financial-search-button" aria-label="Search financial details">
            Search
          </button>
          <button type="button" id="financial-search-clear" class="financial-search-clear">
            Clear
          </button>
        </div>


      </div>
      <div class="financial-layout">
        <nav class="financial-nav" id="financial-nav" aria-label="Financial sections"></nav>
        <div class="financial-content" id="financial-content"></div>
      </div>
      <div class="financial-submit"><button class="main-button" id="submit-financial">Submit</button></div>
    </section>
  </main>

    const visibleFinancialSections = sections;
    const nav = document.getElementById('financial-nav'), content = document.getElementById('financial-content');
    function esc(value) { return String(value).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])); }
    function buildFinancial() {
      nav.innerHTML = visibleFinancialSections.map((section, index) => `<button class="${index === 0 ? 'active' : ''}" data-target="${section.key}"><span>${esc(section.title)}</span><span>›</span></button>`).join('');
      content.innerHTML = visibleFinancialSections.map(section => `<article class="financial-card" id="${section.key}"><header class="financial-card-head"><h3>${esc(section.title)}</h3><div class="financial-card-actions"> <button
    class="financial-reset"
    data-reset="${section.key}"
    style="display:none;"
  >
    Reset
  </button>

  <button
    class="financial-edit"
    data-edit="${section.key}"
  >
    Edit
  </button></div></header><div class="financial-card-body" style="--columns:${section.cols || 3}">${section.fields.map((field, index) => `<div class="financial-field"><label>${esc(field[0])}${field[2] ? '<span class="required">*</span>' : ''}</label>${/^(Is |Photo available|Financial Decision)/.test(field[0]) ? `<select disabled data-field="${esc(section.key + '-' + index)}"><option value="">Select</option><option ${field[1] === 'Y' || field[1] === 'Accept' ? 'selected' : ''}>${field[1] || 'Yes'}</option><option>No</option></select>` : `<input data-field="${esc(section.key + '-' + index)}" value="${esc(field[1])}" readonly />`}</div>`).join('')}</div><div class="financial-review-actions" role="group" aria-label="${esc(section.title)} review"><button type="button" class="financial-review-button agree" data-review="${section.key}" data-decision="agree" aria-pressed="false">Agree</button><button type="button" class="financial-review-button disagree" data-review="${section.key}" data-decision="disagree" aria-pressed="false">Disagree</button></div></article>`).join('');
      // CUW review choices are local to each financial section.
      document.querySelectorAll('[data-review]').forEach(button => {
        button.addEventListener('click', () => {
          const card = document.getElementById(button.dataset.review);
          card.querySelectorAll('[data-review]').forEach(choice => {
            choice.setAttribute('aria-pressed', String(choice === button));
          });
        });
      });

      nav.querySelectorAll('button').forEach(button => button.addEventListener('click', () => { document.getElementById(button.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' }); setActive(button.dataset.target); }));
      const observer = new IntersectionObserver(entries => { const active = entries.filter(x => x.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]; if (active) setActive(active.target.id); }, { rootMargin: '-100px 0px -60% 0px', threshold: .05 });
      document.querySelectorAll('.financial-card').forEach(card => observer.observe(card));

      document.querySelectorAll('[data-edit]').forEach(button => {
        button.addEventListener('click', event => {
          const key = event.currentTarget.dataset.edit;
          const card = document.getElementById(key);

          const resetButton = card.querySelector('[data-reset]');
          const editing = card.dataset.editing === 'true';

          if (!editing) {
            // Store original values before editing
            card.querySelectorAll('[data-field]').forEach(field => {
              if (field.tagName === 'INPUT' || field.tagName === 'SELECT') {
                field.dataset.originalValue = field.value;
              } else {
                field.dataset.originalValue = field.textContent.trim();
              }
            });

            card.dataset.editing = 'true';

            // Show Reset + Save
            button.textContent = 'Save';
            resetButton.style.display = 'inline-block';

            // Make fields editable
            card.querySelectorAll('.financial-readonly').forEach(field => {
              const value = field.textContent.trim();

              const input = document.createElement('input');
              input.className = 'financial-editable';
              input.value = value === '-' ? '' : value;
              input.dataset.field = field.dataset.field;

              field.replaceWith(input);
            });

            card.querySelectorAll('.financial-editable').forEach(input => {
              input.removeAttribute('readonly');
              input.disabled = false;
            });

          } else {
            // SAVE
            card.dataset.editing = 'false';

            card.querySelectorAll('.financial-editable').forEach(input => {
              const readonly = document.createElement('div');

              readonly.className = 'financial-readonly';
              readonly.dataset.field = input.dataset.field;
              readonly.textContent = input.value || '-';

              input.replaceWith(readonly);
            });

            button.textContent = 'Edit';
            resetButton.style.display = 'none';

            toast(`${card.querySelector('h3').textContent} saved successfully.`);
          }
        });
      });

      // document.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', event => { const key = event.currentTarget.dataset.edit, card = document.getElementById(key), editing = card.dataset.editing === 'true'; card.dataset.editing = editing ? 'false' : 'true'; card.querySelectorAll('input,select').forEach(field => { field.readOnly = editing; field.disabled = editing; }); event.currentTarget.textContent = editing ? 'Edit' : 'Save'; if (editing) toast(`${card.querySelector('h3').textContent} saved locally.`); }));
    }

    function setupFinancialSearch() {
      const searchInput = document.getElementById('financial-search-input');
      const searchButton = document.getElementById('financial-search-button');
      const clearButton = document.getElementById('financial-search-clear');

      function clearHighlights() {
        document.querySelectorAll('.financial-card.search-highlight')
          .forEach(card => card.classList.remove('search-highlight'));

        document.querySelectorAll('.financial-field.search-field-highlight')
          .forEach(field => field.classList.remove('search-field-highlight'));
      }

      function performSearch() {
        clearHighlights();

        const query = searchInput.value.trim().toLowerCase();

        if (!query) {
          return;
        }

        const type = 'section';

        if (type === 'section') {
          const sections = document.querySelectorAll('.financial-card');

          const match = [...sections].find(section =>
            section.querySelector('h3')?.textContent
              .toLowerCase()
              .includes(query)
          );

          if (match) {
            match.classList.add('search-highlight');

            match.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });

            setActive(match.id);
          } else {
            toast('No financial section found.');
          }
        }

        if (type === 'field') {
          const fields = document.querySelectorAll('.financial-field');

          const match = [...fields].find(field =>
            field.querySelector('label')?.textContent
              .toLowerCase()
              .includes(query)
          );

          if (match) {
            match.classList.add('search-field-highlight');

            const card = match.closest('.financial-card');

            if (card) {
              card.classList.add('search-highlight');
              setActive(card.id);
            }

            match.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          } else {
            toast('No financial field found.');
          }
        }
      }

      searchButton.addEventListener('click', performSearch);

      searchInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          performSearch();
        }
      });

      clearButton.addEventListener('click', () => {
        searchInput.value = '';
        clearHighlights();
      });
    }

    let activeFinancialTab = 'lifeAssured1';
    function updateFinancialTabs() {
      const avatar = document.getElementById('financial-shared-avatar');
      const isProposer = activeFinancialTab === 'Proposer';
      avatar.textContent = isProposer ? 'P' : 'LA';
      avatar.setAttribute('aria-label', isProposer ? 'Proposer avatar' : 'Life Assured1 avatar');
      document.querySelectorAll('[data-financial-tab]').forEach(tab => {
        const isActive = tab.dataset.financialTab === activeFinancialTab;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-selected', String(isActive));
      });
    }


    function setActive(id) { nav.querySelectorAll('button').forEach(button => button.classList.toggle('active', button.dataset.target === id)); }
    function toast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2800); }
    buildFinancial();
    setupFinancialSearch();
    document.querySelectorAll('[data-financial-tab]').forEach(tab => tab.addEventListener('click', () => {
      activeFinancialTab = tab.dataset.financialTab;
      updateFinancialTabs();
    }));
    updateFinancialTabs();
    document.getElementById('back-to-drs').addEventListener('click', () => { window.location.href = 'drs-screen-prototype.html'; });
    document.querySelector('.header-back').addEventListener('click', () => { window.location.href = 'drs-screen-prototype.html'; });
    document.getElementById('documents-link').addEventListener('click', () => toast('Financial documents are available in the source application.'));
    document.getElementById('submit-financial').addEventListener('click', () => toast('Financial details submitted successfully.'));
    const profile = document.getElementById('profile-trigger'), menu = document.getElementById('user-menu'); profile.addEventListener('click', () => { const open = menu.classList.toggle('open'); profile.setAttribute('aria-expanded', open); document.getElementById('profile-chevron').textContent = open ? '⌃' : '⌄'; });
    document.addEventListener('click', event => { if (!profile.contains(event.target) && !menu.contains(event.target)) menu.classList.remove('open'); });
    const end = Date.now() + 15 * 60 * 1000; function updateClock() { const now = new Date(); document.getElementById('current-time').textContent = now.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }); const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); document.getElementById('session-time').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); } updateClock(); setInterval(updateClock, 1000);
  </script>
