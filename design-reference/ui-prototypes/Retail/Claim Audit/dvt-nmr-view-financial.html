<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICICI Life | View Financial</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #fff;
    }

    body {
      margin: 0;
      color: #1f2937;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app-header {
      height: 57px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: stretch;
      overflow: visible;
      background: linear-gradient(to bottom, #F58220 0%, #E65318 42%, #C92E27 72%, #98252B 100%);
      box-shadow: 0 3px 12px rgba(111, 24, 24, .25);
    }

    .header-back {
      width: 42px;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      background: rgba(126, 22, 31, .42);
      font-size: 26px;
      cursor: pointer;
    }

    .header-back:hover {
      background: rgba(126, 22, 31, .62);
    }

    .brand {
      width: 150px;
      height: 57px;
      object-fit: cover;
      display: block;
    }

    .header-user {
      min-width: 0;
      flex: 1;
      padding: 0 32px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      color: #fff;
    }

    .session {
      min-width: 175px;
      padding-right: 12px;
      text-align: right;
      border-right: 1px solid rgba(255, 255, 255, .35);
      color: rgba(255, 255, 255, .9);
      font-size: 12px;
      line-height: 1.4;
    }

    .session strong {
      display: block;
      margin-top: 3px;
      color: #fff;
      font-size: 11px;
      letter-spacing: .2px;
    }

    .profile-trigger {
      margin-left: 20px;
      padding: 4px 8px;
      border: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }

    .profile-trigger:hover {
      background: rgba(255, 255, 255, .14);
    }

    .profile-circle {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      font-size: 20px;
    }

    .profile-name {
      min-width: 80px;
      margin: 0 8px 0 10px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
    }

    .chevron {
      font-size: 18px;
    }

    .user-menu {
      display: none;
      position: absolute;
      right: 16px;
      top: 65px;
      z-index: 30;
      width: 240px;
      overflow: hidden;
      border: 1px solid #F1D7D0;
      border-radius: 8px;
      color: #323232;
      background: #fff;
      box-shadow: 0 8px 24px rgba(70, 20, 20, .18);
    }

    .user-menu.open {
      display: block;
    }

    .menu-row {
      padding: 15px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .menu-row:hover {
      background: #FFF3EE;
    }

    .menu-row+.menu-row {
      border-top: 1px solid #e0e0e0;
    }

    .menu-row span:first-child {
      color: #9A2529;
      font-size: 14px;
    }

    .page {
      width: 100%;
      padding: 6px 8px 30px;
    }

    .main-button {
      min-height: 28px;
      padding: 4px 11px;
      border: 1px solid #E45F14;
      border-radius: 5px;
      color: #E45F14;
      background: #fff;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .financial-search {
      margin-top: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid #E4E7EC;
      border-radius: 6px;
      background: #F8FAFC;
    }

    .financial-search-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .financial-search select,
    .financial-search input {
      height: 34px;
      padding: 6px 10px;
      border: 1px solid #CBD0D7;
      border-radius: 6px;
      outline: none;
      color: #344054;
      background: #fff;
      font-size: 12px;
    }

    .financial-search select {
      width: 130px;
    }

    .financial-search input {
      width: 280px;
    }

    .financial-search select:focus,
    .financial-search input:focus {
      border-color: #E45F14;
    }

    .financial-search button {
      height: 34px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #financial-search-button {
      border: 0;
      color: #fff;
      background: #9A2529;
    }

    #financial-search-button:hover {
      background: #8F2026;
    }

    .financial-search-clear {
      border: 1px solid #9A2529;
      color: #9A2529;
      background: #fff;
    }

    .financial-search-clear:hover {
      color: #fff;
      background: #9A2529;
    }

    /* Highlight searched financial section */
    .financial-card.search-highlight {
      border: 2px solid #E45F14;
      box-shadow: 0 0 0 3px rgba(228, 95, 20, 0.12);
      animation: financialHighlight 1.2s ease;
    }

    @keyframes financialHighlight {
      0% {
        box-shadow: 0 0 0 6px rgba(228, 95, 20, 0.25);
      }

      100% {
        box-shadow: 0 0 0 3px rgba(228, 95, 20, 0.12);
      }
    }

    .financial-field.search-field-highlight {
      padding: 6px;
      border: 2px solid #E45F14;
      border-radius: 8px;
      background: #FFF8F3;
    }

    .financial-shell {
      display: none;
      margin-top: 8px;
    }

    .financial-shell.visible {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      row-gap: 9px;
      width: 100%;
      min-width: 0;
      margin-top: 9px;
    }

    .financial-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .financial-person-switcher {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
    }

    .financial-table-area { padding: 8px 10px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
    .financial-table-area .financial-card-body { padding: 0; }
    .financial-table-wrap { width: 100%; min-width: 0; overflow-x: auto; border: 1px solid #E4E7EC; border-radius: 6px; }
    .financial-table-title { margin: 0 0 5px; color: #344054; font-size: 12px; font-weight: 700; }
    .financial-table { width: 100%; min-width: 680px; border-collapse: collapse; table-layout: fixed; }
    .financial-table.receipts { min-width: 900px; }
    .financial-table th, .financial-table td { padding: 6px 8px; border-bottom: 1px solid #E4E7EC; vertical-align: middle; }
    .financial-table tr:last-child th, .financial-table tr:last-child td { border-bottom: 0; }
    .financial-table thead th { color: #475467; background: #F8FAFC; font-size: 12px; font-weight: 700; text-align: left; }
    .financial-table tbody th { color: #475467; background: #fff; font-size: 13px; font-weight: 500; text-align: left; overflow-wrap: anywhere; }
    .financial-table tbody tr:nth-child(even) { background: #FCFCFD; }
    .financial-table td .financial-field, .financial-table td input, .financial-table td select { min-width: 0; }
    .form-j-calculated-row { background: #FFF8F4; }
    .auto-calculated { color: #8D4A21; font-size: 12px; font-weight: 700; white-space: nowrap; }

    .financial-submit {
      grid-column: 1 / -1;
    }

    .financial-shared-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #E45F14;
      border-radius: 50%;
      color: #9A2529;
      background: #FFF4EC;
      font-size: 12px;
      font-weight: 800;
    }

    .financial-tabs {
      display: flex;
      align-items: flex-end;
      gap: 18px;
    }

    .financial-tab {
      padding: 5px 2px 7px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: #667085;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .financial-tab:hover {
      color: #9A2529;
    }

    .financial-tab.active {
      border-bottom-color: #E45F14;
      color: #9A2529;
      font-weight: 800;
    }

    .financial-back {
      padding: 5px 11px;
      border: 1px solid #E45F14;
      border-radius: 18px;
      color: #A92129;
      background: #FFF4EC;
      box-shadow: 0 2px 7px rgba(169, 33, 41, .12);
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .documents-link {
      padding: 5px 8px;
      border: 0;
      color: #9A2529;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    .financial-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      align-items: start;
      gap: 12px;
      width: 100%;
      min-width: 0;
      margin-top: 8px;
    }

    .financial-nav {
      width: 100%;
      min-width: 0;
      position: sticky;
      top: 72px;
      max-height: calc(100vh - 84px);
      overflow-y: auto;
      border: 1px solid #D6D8DC;
      border-radius: 4px;
      background: #F8F9FB;
    }

    .financial-nav button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid #EAECEF;
      border-left: 3px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: #667085;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
    }

    .financial-nav button.active {
      border-left-color: #DE2C3B;
      color: #B42318;
      background: #fff;
      font-weight: 600;
    }

    .financial-content {
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .financial-card {
      min-width: 0;
      scroll-margin-top: 75px;
      overflow: hidden;
      border: 1px solid #E4E7EC;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .08);
    }

    .financial-card-head {
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #E4E7EC;
      background: #F8FAFC;
    }

    .financial-card-head h3 {
      margin: 0;
      color: #1F2937;
      font-size: 14px;
      font-weight: 700;
    }

    .financial-card-actions {
      display: flex;
      gap: 8px;
    }

    .financial-save {
      min-width: 80px;
      padding: 5px 10px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: #9A2529;
      font-size: 13px;
      cursor: pointer;
    }

    .financial-save:hover {
      background: #8f2026;
    }

    .financial-reset {
      min-width: 80px;
      padding: 5px 10px;
      border: 1px solid #9A2529;
      border-radius: 4px;
      color: #9A2529;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .financial-card-body {
      padding: 8px 10px;
      display: grid;
      grid-template-columns: repeat(var(--columns, 3), minmax(0, 1fr));
      gap: 8px;
    }

    .monthly-income-section { padding: 8px 10px; display: grid; gap: 8px; }
    .monthly-income-rows { display: grid; gap: 6px; padding: 7px; border: 1px solid #E4E7EC; border-radius: 7px; background: #fff; }
    .monthly-income-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(150px, 1fr) auto; gap: 8px; align-items: end; padding: 7px; border: 0; border-radius: 5px; background: #fff; }
    .monthly-income-row .financial-field { min-width: 0; }
    .monthly-income-add { justify-self: start; min-height: 32px; padding: 5px 10px; border: 1px solid #E45F14; border-radius: 5px; color: #E45F14; background: #fff; font-size: 11px; font-weight: 700; cursor: pointer; }
    .monthly-income-add:disabled { opacity: .55; cursor: not-allowed; }
    .monthly-income-average { padding-top: 2px; border-top: 1px solid #E4E7EC; }
    .monthly-income-average .financial-card-body { padding: 8px 0 0; }
    .statement-month-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; padding: 7px; border: 1px solid #E4E7EC; border-radius: 7px; background: #fff; }
    .statement-month-field { min-width: 0; display: grid; grid-template-columns: minmax(128px, 1fr) minmax(230px, 1.6fr); align-items: center; gap: 8px; }
    .statement-month-field label { margin: 0; color: #475467; font-size: 11px; font-weight: 600; }
    .statement-month-inputs { min-width: 0; display: grid; grid-template-columns: minmax(92px, .8fr) minmax(112px, 1fr); gap: 6px; }
    .statement-month-inputs select, .statement-month-inputs input { min-width: 0; }

    .sip-income-table { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; border: 1px solid #E4E7EC; border-radius: 7px; background: #fff; }
    .sip-income-table th, .sip-income-table td { padding: 7px 9px; text-align: left; vertical-align: middle; border-bottom: 1px solid #E4E7EC; }
    .sip-income-table tr:last-child td { border-bottom: 0; }
    .sip-income-table th { color: #6B2731; background: #FFF3EE; font-size: 11px; font-weight: 700; }
    .sip-income-table .financial-field label { display: none; }

    .financial-field label {
      margin: 0 0 3px;
      display: flex;
      gap: 2px;
      color: #475467;
      font-size: 12px;
    }

    .required {
      color: #B42318;
      font-weight: 700;
    }

    .financial-field input,
    .financial-field select {
      width: 100%;
      min-height: 33px;
      padding: 6px 8px;
      border: 1px solid #E4E7EC;
      border-radius: 8px;
      outline: none;
      color: #344054;
      background: #EFF1F3;
      font-size: 13px;
    }

    .financial-field input[readonly],
    .financial-field select:disabled {
      min-height: 33px;
      padding: 6px 8px;
      border: 1px solid #E4E7EC;
      border-radius: 8px;
      color: #344054;
      background: #EFF1F3;
      cursor: default;
      outline: none;
    }

    /* No visual focus effect in read-only state */
    .financial-field input[readonly]:focus,
    .financial-field select:disabled:focus {
      border-color: #E4E7EC;
      outline: none;
      box-shadow: none;
    }

    .financial-readonly {
      width: 100%;
      min-height: 33px;
      padding: 6px 8px;
      border-radius: 8px;
      background: #EFF1F3;
      border: 1px solid #E4E7EC;
      color: #344054;
      font-size: 13px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
      cursor: default;
      user-select: text;
    }

    .financial-editable {
      width: 100%;
      min-height: 38px;
      padding: 7.6px 10px;
      border: 1px solid #CBD0D7;
      border-radius: 8px;
      outline: none;
      color: #344054;
      background: #fff;
      font-size: 13px;
    }

    .financial-editable:focus {
      border-color: #9A2529;
    }

    /* Editable state */
    .financial-field input:not([readonly]),
    .financial-field select:not(:disabled) {
      background: #fff;
      border: 1px solid #CBD0D7;
      cursor: text;
    }

    .financial-field input:not([readonly]):focus,
    .financial-field select:not(:disabled):focus {
      border-color: #9A2529;
      outline: none;
      box-shadow: none;
    }

    /* CUW review actions use the same green/red outline and selected states as ViewFinancial.tsx. */
    .financial-review-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 7px 12px;
      border-top: 1px solid #E4E7EC;
      background: #FCFCFD;
    }

    .financial-review-button {
      min-width: 90px;
      padding: 5px 12px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .financial-review-button.agree {
      color: #027A48;
    }

    .financial-review-button.disagree {
      color: #B42318;
    }

    .financial-review-button.agree[aria-pressed="true"] {
      color: #fff;
      background: #027A48;
    }

    .financial-review-button.disagree[aria-pressed="true"] {
      color: #fff;
      background: #B42318;
    }

    .financial-review-button.agree:hover {
      border-color: #05603A;
    }

    .financial-review-button.disagree:hover {
      border-color: #912018;
    }

    .financial-review-button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .financial-review-button:disabled:hover {
      border-color: currentColor;
    }

    .financial-submit {
      padding: 16px;
      display: flex;
      justify-content: flex-end;
      border-radius: 8px;
      background: #fff;
    }

    .financial-submit .main-button {
      min-width: 110px;
      border: 0;
      border-radius: 50px;
      color: #fff;
      background: #9A2529;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      display: none;
      padding: 12px 16px;
      border-radius: 6px;
      color: #fff;
      background: #027A48;
      box-shadow: 0 4px 14px rgba(16, 24, 40, .25);
      font-size: 13px;
    }

    .toast.show {
      display: block;
    }

      .banner-shell {
        /* position: sticky; */
        top: 0;
        z-index: 20;
        padding: 6px 4px 0;
        background: #fff;
        }

        .banner {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        margin-bottom: 6px;
        overflow: hidden;
        background: #ffead7;
        color: #000;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(169, 33, 41, .16);
        }

        .banner-avatar {
        min-height: 138px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e45f14, #c83c2f);
        }

        .banner-avatar span {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        border: 2px solid rgba(255, 255, 255, .45);
        border-radius: 50%;
        background: rgba(255, 255, 255, .18);
        }

        .banner-avatar svg {
        width: 44px;
        height: 44px;
        }

        .banner-content {
        padding: 12px 18px;
        min-width: 0;
        }

        .banner-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 4px;
        }

        .banner-title strong {
        font-size: 16px;
        font-weight: 900;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        }

      .app-pill {
      padding: 4px 9px;
      flex: none;
      border: 1px solid rgba(169, 33, 41, .18);
      border-radius: 16px;
      background: #fff;
      color: #a92129;
      font-size: 13px;
      font-weight: 900;
    }

    .banner-line {
      font-size: 11.5px;
      line-height: 1.6;
      margin: 4px 0;
    }

    .banner-line.product {
      font-size: 10px;
      font-weight: 800;
    }

     .content {
      padding: 6px 4px 0;
    }

    @media (max-width: 800px) {
      .header-user {
        padding: 0 8px;
      }

      .session,
      .profile-name {
        display: none;
      }

      .financial-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .financial-shell.visible {
        grid-template-columns: 1fr;
        row-gap: 8px;
      }

      .financial-topbar,
      .financial-person-switcher,
      .financial-layout,
      .financial-submit {
        grid-column: 1;
      }

      .financial-person-switcher {
        grid-row: 2;
      }

      .financial-nav {
        position: static;
        width: 100%;
        min-width: 0;
        max-height: 260px;
      }

      .financial-card-body {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      .brand {
        width: 128px;
      }

      .financial-card-body {
        grid-template-columns: 1fr;
      }

      .monthly-income-row { grid-template-columns: 1fr; }
      .statement-month-grid { grid-template-columns: 1fr; }
      .statement-month-field { grid-template-columns: 1fr; gap: 4px; }

      .documents-link {
        min-width: 0;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <!-- Complete financial view reproduced as its financial section navigator and data cards. -->
    <section class="financial-shell visible" id="financial-shell" aria-label="View Financial">
      <div class="financial-topbar"><button class="financial-back" id="back-to-drs">← Back to
          DRS</button>

        <div class="financial-person-switcher" aria-label="Financial applicant selection">

ip_statement:Average Annual Income","gst_income:Total of Gross Sales","gst_income:Average Gross Sales","gst_income:Average Annual Income","bank_statement_salary_credit:Average Net Salary Credited PM","bank_statement_salary_credit:Net Salary Credited PA","bank_statement_salary_credit:Average Annual Income","epf_advanced:Annual Income"]);
    // Keep Decision as the final section in both the left navigation and content area.
    const decisionIndex = sections.findIndex(section => section.key === 'decision');
    if (decisionIndex >= 0) sections.push(sections.splice(decisionIndex, 1)[0]);
    const visibleFinancialSections = sections;
    const nav = document.getElementById('financial-nav'), content = document.getElementById('financial-content');
    function esc(value) { return String(value).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])); }
    function fieldControl(section, field, index) {
      const [label, value] = field;
      const fieldId = `${section.key}-${index}`;
      const isLocked = lockedFields.has(`${section.key}:${label}`);
      const attributes = `data-field="${esc(fieldId)}" data-field-label="${esc(label)}" aria-label="${esc(section.title + ': ' + label)}"${isLocked ? ' data-locked="true"' : ''}`;
      if (section.key === 'decision' && label === 'Financial Decision') {
        const options = ['', 'financially eligible', 'counter offer', 'reject'];
        return `<select ${attributes}>${options.map(option => `<option value="${esc(option)}"${option === value ? ' selected' : ''}>${esc(option || 'Select financial decision')}</option>`).join('')}</select>`;
      }
      const isYesNo = /^(Is\b|Photo available\b|Latest 6 months.*statements given\b|Any Overdraft)/i.test(label);
      if (isYesNo) {
        const options = ['', 'Yes', 'No'];
        if (value && !options.includes(value)) options.splice(1, 0, value);
        return `<select disabled ${attributes}>${options.map(option => `<option value="${esc(option)}"${option === value ? ' selected' : ''}>${esc(option || 'Select')}</option>`).join('')}</select>`;
      }
      return `<input type="text" value="${esc(value)}" ${attributes} readonly />`;
    }

    function fieldGrid(section, labels, columns = 3) {
      return `<div class="financial-card-body" style="--columns:${columns}">${labels.map(item => {
        const display = typeof item === 'string' ? item : item.label;
        const fieldLabel = typeof item === 'string' ? item : item.fieldLabel || item.label;
        const index = section.fields.findIndex(field => field[0] === fieldLabel);
        if (index < 0) return '';
        const field = section.fields[index];
        return `<div class="financial-field"><label>${esc(display)}${field[2] ? '<span class="required">*</span>' : ''}</label>${fieldControl(section, field, index)}</div>`;
      }).join('')}</div>`;
    }

    function sectionTable(section, layout) {
      const count = layout.kind === 'receipts' ? 6 : layout.kind === 'year4' ? 4 : 3;
      const headings = Array.from({ length: count }, (_, i) => layout.kind === 'receipts' ? `Receipt ${i + 1}` : `Year ${i + 1}`);
      const firstWidth = count === 6 ? '12%' : count === 4 ? '20%' : '28%';
      const monthWidth = count === 6 ? '12%' : '0%';
      const restWidth = `${(100 - parseInt(firstWidth, 10) - parseInt(monthWidth, 10)) / count}%`;
      const formJMonths = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const rows = layout.rows.map(label => {
        const indexes = headings.map((_, column) => {
          const fieldLabel = layout.kind === 'receipts' ? `${label} Receipt${column + 1}` : column === 0 ? label : `${label} Year ${column + 1}`;
          return section.fields.findIndex(field => field[0] === fieldLabel);
        });
        const required = indexes.some(index => index >= 0 && section.fields[index][2]);
        const rowHeading = `<th scope="row">${esc(label)}${required && layout.kind !== 'receipts' ? '<span class="required">*</span>' : ''}</th>`;
        const monthSelect = layout.kind === 'receipts' ? `<td class="form-j-month-cell"><div class="financial-field"><select data-form-j-month disabled aria-label="Select month for ${esc(label)}">${formJMonths.map(month => `<option value="${month}">${month || 'Select month'}</option>`).join('')}</select></div></td>` : '';
        return `<tr>${rowHeading}${monthSelect}${indexes.map(index => `<td>${index < 0 ? '' : `<div class="financial-field">${fieldControl(section, section.fields[index], index)}</div>`}</td>`).join('')}</tr>`;
      }).join('');
      const receiptTopRow = layout.kind === 'receipts' && layout.top?.length ? (() => {
        const index = section.fields.findIndex(field => field[0] === layout.top[0]);
        return `<tr class="form-j-name-row"><th scope="row">${esc(layout.top[0])}${index >= 0 && section.fields[index][2] ? '<span class="required">*</span>' : ''}</th><td colspan="${headings.length + 1}">${index >= 0 ? `<div class="financial-field">${fieldControl(section, section.fields[index], index)}</div>` : ''}</td></tr>`;
      })() : '';
      const receiptSummaryRows = layout.kind === 'receipts' ? `<tr class="form-j-calculated-row">${layout.bottom.map(item => {
        const index = section.fields.findIndex(field => field[0] === item.fieldLabel);
        return `<th scope="row">${esc(item.label)}</th><td>${index >= 0 ? `<div class="financial-field"><input type="text" value="${esc(section.fields[index][1])}" readonly data-locked="true" aria-label="${esc(section.title + ': ' + item.label)}" /></div>` : ''}</td>`;
      }).join('')}</tr>` : '';
      const columns = layout.kind === 'receipts' ? `<col style="width:${firstWidth}" /><col style="width:${monthWidth}" />${headings.map(() => `<col style="width:${restWidth}" />`).join('')}` : `<col style="width:${firstWidth}" />${headings.map(() => `<col style="width:${restWidth}" />`).join('')}`;
      const header = layout.kind === 'receipts' ? `<tr><th scope="col"></th><th scope="col"></th>${headings.map(heading => `<th scope="col">${heading}</th>`).join('')}</tr>` : `<tr><th scope="col"></th>${headings.map(heading => `<th scope="col">${heading}</th>`).join('')}</tr>`;
      return `<div><h4 class="financial-table-title">${esc(layout.title || section.title)}</h4><div class="financial-table-wrap"><table class="financial-table ${layout.kind === 'receipts' ? 'receipts' : ''}"><colgroup>${columns}</colgroup><thead>${receiptTopRow}${header}</thead><tbody>${rows}${receiptSummaryRows}</tbody></table></div></div>`;
    }

    function monthlyIncomeRow() {
      const months = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      return `<div class="monthly-income-row" data-monthly-income-row><div class="financial-field"><label>Month<span class="required">*</span></label><select data-monthly-income disabled>${months.map(month => `<option value="${month}">${month || 'Select month'}</option>`).join('')}</select></div><div class="financial-field"><label>Income<span class="required">*</span></label><input data-monthly-income type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter income" readonly /></div><button type="button" class="monthly-income-add" data-add-monthly-income disabled>+ Add</button></div>`;
    }

    function monthlyIncomeTable(sectionKey) {
      const months = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const monthCount = ['commission_statement', 'bank_statement_salary_credit'].includes(sectionKey) ? 6 : 3;
      const rows = Array.from({ length: monthCount }, (_, index) => index + 1).map(number => `<tr><td>Month ${number}</td><td><div class="financial-field"><select data-monthly-income disabled aria-label="Month ${number}">${months.map(month => `<option value="${month}">${month || 'Select month'}</option>`).join('')}</select></div></td><td><div class="financial-field"><input data-monthly-income type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter income" aria-label="Income for month ${number}" readonly /></div></td></tr>`).join('');
      return `<table class="sip-income-table"><thead><tr><th>Month</th><th>Selected Month<span class="required">*</span></th><th>Income<span class="required">*</span></th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function monthlyIncomeBody(section, layout) {
      const excluded = new Set([...layout.top, ...layout.average]);
      const remaining = section.fields.map(field => field[0]).filter(label => !excluded.has(label) && !/month|monthly|net salary credited pm|sip per month/i.test(label));
      // Commission and salary-credit statements need six monthly entries; the other proof sections retain three.
      const incomeEntry = monthlyIncomeTable(section.key);
      return `<div class="monthly-income-section">${layout.top.length ? fieldGrid(section, layout.top) : ''}${incomeEntry}${layout.average.length ? `<div class="monthly-income-average">${fieldGrid(section, layout.average)}</div>` : ''}${remaining.length ? `<div class="monthly-income-average">${fieldGrid(section, remaining)}</div>` : ''}</div>`;
    }

    function statementMonthGrid(section, labels) {
      const months = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      return `<div class="statement-month-grid">${labels.map(item => {
        const display = typeof item === 'string' ? item : item.label;
        const fieldLabel = typeof item === 'string' ? item : item.fieldLabel;
        const index = section.fields.findIndex(field => field[0] === fieldLabel);
        if (index < 0) return '';
        const field = section.fields[index];
        return `<div class="statement-month-field"><label>${esc(display)}${field[2] ? '<span class="required">*</span>' : ''}</label><div class="statement-month-inputs"><select data-statement-month disabled aria-label="Select month for ${esc(display)}">${months.map(month => `<option value="${month}">${month || 'Select'}</option>`).join('')}</select>${fieldControl(section, field, index)}</div></div>`;
      }).join('')}</div>`;
    }

    function statementBody(section, layout) {
      return `<div class="monthly-income-section">${layout.top?.length ? fieldGrid(section, layout.top, 2) : ''}${statementMonthGrid(section, layout.monthly)}${layout.calculated?.length ? `<div class="monthly-income-average">${fieldGrid(section, layout.calculated, 2)}</div>` : ''}${layout.trailing?.length ? `<div class="monthly-income-average">${fieldGrid(section, layout.trailing, 2)}</div>` : ''}</div>`;
    }

    function sectionBody(section) {
      const monthlyLayout = monthlyIncomeLayouts[section.key];
      if (monthlyLayout) return monthlyIncomeBody(section, monthlyLayout);
      const statementLayout = statementLayouts[section.key];
      if (statementLayout) return statementBody(section, statementLayout);
      const layout = tableLayouts[section.key];
      if (!layout) return fieldGrid(section, section.fields.map(field => field[0]), section.cols || 3);
      return `<div class="financial-table-area">${layout.top?.length && section.key !== 'form_j' ? fieldGrid(section, layout.top, 2) : ''}${sectionTable(section, layout)}${layout.bottom?.length && section.key !== 'form_j' ? fieldGrid(section, layout.bottom) : ''}</div>`;
    }

    function buildFinancial() {
      nav.innerHTML = visibleFinancialSections.map((section, index) => `<button class="${index === 0 ? 'active' : ''}" data-target="${section.key}"><span>${esc(section.title)}</span><span>›</span></button>`).join('');
      content.innerHTML = visibleFinancialSections.map(section => {
        const hasReviewActions = !['financial_profession', 'credit_bureau_details', 'decision'].includes(section.key);
        const reviewActions = hasReviewActions ? `<div class="financial-review-actions" role="group" aria-label="${esc(section.title)} review"><button type="button" class="financial-review-button agree" data-review="${section.key}" data-decision="agree" aria-pressed="false">Agree</button><button type="button" class="financial-review-button disagree" data-review="${section.key}" data-decision="disagree" aria-pressed="false">Disagree</button></div>` : '';
        return `<article class="financial-card" id="${section.key}"><header class="financial-card-head"><h3>${esc(section.title)}</h3></header>${sectionBody(section)}${reviewActions}</article>`;
      }).join('');
      // Only the section under review becomes editable when Disagree is selected.
      content.querySelectorAll('[data-review]').forEach(button => {
        button.addEventListener('click', () => {
          const card = document.getElementById(button.dataset.review);
          if (button.dataset.decision === 'disagree' && card.dataset.editing !== 'true') {
            card.querySelectorAll('[data-field]').forEach(field => {
              field.dataset.originalValue = field.value;
            });
            setSectionEditing(card, true);
          } else if (button.dataset.decision === 'agree' && card.dataset.editing === 'true') {
            restoreSectionFields(card);
            setSectionEditing(card, false);
          }
          card.querySelectorAll('[data-review]').forEach(choice => {
            choice.setAttribute('aria-pressed', String(choice === button));
          });
        });
      });

      content.querySelectorAll('[data-reset]').forEach(button => {
        button.addEventListener('click', () => {
          restoreSectionFields(document.getElementById(button.dataset.reset));
        });
      });

      content.querySelectorAll('[data-save]').forEach(button => {
        button.addEventListener('click', () => {
          const card = document.getElementById(button.dataset.save);
          setSectionEditing(card, false);
          toast(`${card.querySelector('h3').textContent} saved successfully.`);
        });
      });

      content.querySelectorAll('[data-add-monthly-income]').forEach(button => {
        button.addEventListener('click', () => {
          const card = button.closest('.financial-card');
          if (card.dataset.editing !== 'true') return;
          const rows = card.querySelector('[data-monthly-income-rows]');
          rows.insertAdjacentHTML('beforeend', monthlyIncomeRow());
          const newRow = rows.lastElementChild;
          newRow.querySelectorAll('select[data-monthly-income]').forEach(field => { field.disabled = false; });
          newRow.querySelectorAll('input[data-monthly-income]').forEach(field => { field.readOnly = false; });
          newRow.querySelectorAll('[data-add-monthly-income]').forEach(addButton => { addButton.disabled = false; });
        });
      });

      nav.querySelectorAll('button').forEach(button => button.addEventListener('click', () => { document.getElementById(button.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' }); setActive(button.dataset.target); }));
      const observer = new IntersectionObserver(entries => { const active = entries.filter(x => x.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]; if (active) setActive(active.target.id); }, { rootMargin: '-100px 0px -60% 0px', threshold: .05 });
      document.querySelectorAll('.financial-card').forEach(card => observer.observe(card));

    }

    function setSectionEditing(card, editing) {
      card.dataset.editing = String(editing);
      card.querySelectorAll('.financial-field input').forEach(field => {
        field.readOnly = !editing || field.dataset.locked === 'true';
      });
      card.querySelectorAll('.financial-field select').forEach(field => {
        field.disabled = !editing || field.dataset.locked === 'true';
      });
      card.querySelectorAll('[data-monthly-income]').forEach(field => {
        if (field.tagName === 'SELECT') field.disabled = !editing;
        else field.readOnly = !editing;
      });
      card.querySelectorAll('[data-form-j-month]').forEach(field => { field.disabled = !editing; });
      card.querySelectorAll('[data-statement-month]').forEach(field => { field.disabled = !editing; });
      card.querySelectorAll('[data-add-monthly-income]').forEach(button => { button.disabled = !editing; });
      const resetButton = card.querySelector('[data-reset]');
      const saveButton = card.querySelector('[data-save]');
      if (resetButton) resetButton.hidden = !editing;
      if (saveButton) saveButton.hidden = !editing;
    }

    function restoreSectionFields(card) {
      card.querySelectorAll('[data-field]').forEach(field => {
        field.value = field.dataset.originalValue ?? '';
      });
    }

    function setupFinancialSearch() {
      const searchInput = document.getElementById('financial-search-input');
      const searchButton = document.getElementById('financial-search-button');
      const clearButton = document.getElementById('financial-search-clear');

      function clearHighlights() {
        document.querySelectorAll('.financial-card.search-highlight')
          .forEach(card => card.classList.remove('search-highlight'));

        document.querySelectorAll('.financial-field.search-field-highlight')
          .forEach(field => field.classList.remove('search-field-highlight'));
      }

      function performSearch() {
        clearHighlights();

        const query = searchInput.value.trim().toLowerCase();

        if (!query) {
          return;
        }

        const type = 'section';

        if (type === 'section') {
          const sections = document.querySelectorAll('.financial-card');

          const match = [...sections].find(section =>
            section.querySelector('h3')?.textContent
              .toLowerCase()
              .includes(query)
          );

          if (match) {
            match.classList.add('search-highlight');

            match.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });

            setActive(match.id);
          } else {
            toast('No financial section found.');
          }
        }

        if (type === 'field') {
          const fields = document.querySelectorAll('.financial-field');

          const match = [...fields].find(field =>
            field.querySelector('label')?.textContent
              .toLowerCase()
              .includes(query)
          );

          if (match) {
            match.classList.add('search-field-highlight');

            const card = match.closest('.financial-card');

            if (card) {
              card.classList.add('search-highlight');
              setActive(card.id);
            }

            match.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          } else {
            toast('No financial field found.');
          }
        }
      }

      searchButton.addEventListener('click', performSearch);

      searchInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          performSearch();
        }
      });

      clearButton.addEventListener('click', () => {
        searchInput.value = '';
        clearHighlights();
      });
    }

    let activeFinancialTab = 'lifeAssured1';
    function updateFinancialTabs() {
      const avatar = document.getElementById('financial-shared-avatar');
      const isProposer = activeFinancialTab === 'Proposer';
      avatar.textContent = isProposer ? 'P' : 'LA';
      avatar.setAttribute('aria-label', isProposer ? 'Proposer avatar' : 'Life Assured1 avatar');
      document.querySelectorAll('[data-financial-tab]').forEach(tab => {
        const isActive = tab.dataset.financialTab === activeFinancialTab;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-selected', String(isActive));
      });
    }


    function setActive(id) { nav.querySelectorAll('button').forEach(button => button.classList.toggle('active', button.dataset.target === id)); }
    function toast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2800); }
    buildFinancial();
    setupFinancialSearch();
    document.querySelectorAll('[data-financial-tab]').forEach(tab => tab.addEventListener('click', () => {
      activeFinancialTab = tab.dataset.financialTab;
      updateFinancialTabs();
    }));
    updateFinancialTabs();
    const closeFinancialView = () => {
      if (window.parent !== window) {
        window.parent.postMessage('close-financial-view', window.location.origin);
        return;
      }
      window.history.back();
    };
    document.getElementById('back-to-drs').addEventListener('click', closeFinancialView);
    document.getElementById('documents-link').addEventListener('click', () => toast('Financial documents are available in the source application.'));
    document.getElementById('submit-financial').addEventListener('click', () => toast('Financial details submitted successfully.'));
  </script>
</body>
