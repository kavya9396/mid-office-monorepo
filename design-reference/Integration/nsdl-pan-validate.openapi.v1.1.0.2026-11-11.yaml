openapi: 3.0.3
info:
  title: External Event Service - NSDL PAN Validate
  version: 1.1.0
  description: |
    Validates a PAN against NSDL for an application.
    Derived from the URL and the sample request/response supplied by the user. Version 1.1.0 replaces the
    response structure of 1.0.0 (see "Changes from 1.0.0").
    Spec date: 2026-11-11. Spec version: 1.1.0.

    Changes from 1.0.0:
    - `message` now carries text (for example "Existing and Valid PAN").
    - New top-level `aadharSeedingStatus` and `pan_validation`.
    - `data.return` is gone; `data` now only holds `panValidation`.

    Reading rules agreed with the user (see nsdl-pan-validate.md):
    - `error` decides whether the API call succeeded (false) or failed (true).
    - `pan_validation` decides the PAN validation status.
    - `message` is shown to the user for both success and failure.
    - `data` is IGNORED for now: it is present in the response but is deliberately not described or read.

    The HTTP method is POST (confirmed by the user). Request and response are plain JSON, with no payload
    encryption (confirmed by the user).
  x-spec-date: "2026-11-11"
  x-supersedes: nsdl-pan-validate.openapi.v1.0.0.2026-11-11.yaml
  x-source: user-supplied sample (chat), 2026-11-11
servers:
  - url: https://midoffice-uat-api.icicilife.com
    description: UAT
paths:
  /icic-external-event-service/v1/nsdl/pan/validate:
    post:
      operationId: validateNsdlPan
      summary: Validate a PAN with NSDL
      description: |
        HTTP method is POST (confirmed by the user). Plain JSON request and response, no payload encryption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NsdlPanValidateRequest"
            example:
              applicationNumber: OS94845380
              pan: ACBPJ4468N
              name: SACHIN NARAYAN JOSHI
              dob: 03/06/1967
              fatherName: ""
      responses:
        "200":
          description: NSDL validation envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NsdlPanValidateResponse"
              example:
                error: false
                message: Existing and Valid PAN
                aadharSeedingStatus: "Y"
                data:
                  panValidation:
                    - null
                pan_validation: true
                event_name: NSDL
                response_code: 200
components:
  schemas:
    NsdlPanValidateRequest:
      type: object
      required: [applicationNumber, pan, name, dob, fatherName]
      properties:
        applicationNumber:
          type: string
          example: OS94845380
        pan:
          type: string
          example: ACBPJ4468N
        name:
          type: string
          example: SACHIN NARAYAN JOSHI
        dob:
          type: string
          description: Date in DD/MM/YYYY format (from the sample)
          example: 03/06/1967
        fatherName:
          type: string
          description: Empty string in the sample; whether it may be empty is unconfirmed
          example: ""
    NsdlPanValidateResponse:
      type: object
      properties:
        error:
          type: boolean
          description: false = API call succeeded, true = API call failed
        message:
          type: string
          description: Text to show the user for both success and failure
          example: Existing and Valid PAN
        aadharSeedingStatus:
          type: string
          description: Sample value "Y". What the UI does with it is not decided yet.
          example: "Y"
        data:
          type: object
          description: Present in the response but ignored for now; intentionally not described.
          additionalProperties: true
        pan_validation:
          type: boolean
          description: PAN validation status; true -> flag Y, false -> flag No
        event_name:
          type: string
          example: NSDL
        response_code:
          type: integer
          example: 200
