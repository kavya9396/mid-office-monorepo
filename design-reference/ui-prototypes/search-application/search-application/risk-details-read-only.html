<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risk Details - Compact Prototype</title>
  <style>
    :root{
      --orange:#E45F14;
      --orange-dark:#D95712;
      --orange-soft:#FFF1E6;
      --border:#E3E3E3;
      --text:#263238;
      --muted:#68717A;
      --bg:#F4F5F6;
      --surface:#FFFFFF;
      --label:#F8F8F8;
      --success:#2F7D32;
      --shadow:0 5px 18px rgba(0,0,0,.06);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
    body{overflow:hidden}

    .app-shell{height:100vh;display:flex;flex-direction:column}

    .app-header{
      height:57px;
      flex:0 0 57px;
      position:relative;
      z-index:20;
      display:flex;
      align-items:stretch;
      overflow:visible;
      background:linear-gradient(to bottom,#f58220 0%,#e65318 42%,#c92e27 72%,#98252b 100%);
      box-shadow:0 3px 12px rgba(111,24,24,.25);
    }
    .header-back{
      width:42px;flex:0 0 42px;border:0;border-right:1px solid rgba(255,255,255,.25);
      color:#fff;background:rgba(126,22,31,.42);font-size:26px;cursor:pointer;
    }
    .header-back:hover{background:rgba(126,22,31,.62)}
    .app-header > svg{width:150px;height:57px;display:block;flex:0 0 150px;padding:5px 8px;overflow:visible}
    .header-user{min-width:0;flex:1;padding:0 32px;display:flex;justify-content:flex-end;align-items:center;color:#fff}
    .session{min-width:175px;padding-right:12px;text-align:right;border-right:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.9);font-size:12px;line-height:1.4}
    .session strong{display:block;margin-top:3px;color:#fff;font-size:11px;letter-spacing:.2px}
    .profile-trigger{margin-left:20px;padding:4px 8px;border:0;border-radius:8px;display:flex;align-items:center;color:#fff;background:transparent;cursor:pointer}
    .profile-trigger:hover{background:rgba(255,255,255,.14)}
    .profile-circle{width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(255,255,255,.2);font-size:20px}
    .profile-name{min-width:80px;margin:0 8px 0 10px;text-align:left;font-size:12px;font-weight:700}
    .chevron{font-size:18px}
    .user-menu{display:none;position:absolute;right:16px;top:65px;z-index:30;width:240px;overflow:hidden;border:1px solid #f1d7d0;border-radius:8px;color:#323232;background:#fff;box-shadow:0 8px 24px rgba(70,20,20,.18)}
    .user-menu.open{display:block}
    .menu-row{padding:15px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
    .menu-row:hover{background:#fff3ee}
    .menu-row + .menu-row{border-top:1px solid #e0e0e0}
    .menu-row span:first-child{color:#9a2529;font-size:14px}


    .page{
      height:calc(100vh - 57px);
      padding:10px 14px;
      overflow:hidden;
    }

    .panel{
      height:100%;
      background:var(--surface);
      border:1px solid #D8D8D8;
      border-radius:10px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:grid;
      grid-template-rows:44px 42px 92px minmax(0,1fr) 88px;
    }

    .page-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      background:var(--orange);
      color:#fff;
    }
    .page-title h1{font-size:18px;margin:0;font-weight:700}

    .tabs{display:flex;align-items:end;padding:0 14px;border-bottom:1px solid var(--border);gap:4px}
    .tab{height:41px;border:none;background:transparent;padding:0 16px;cursor:pointer;font-size:13px;font-weight:600;color:#4f575e;border-bottom:3px solid transparent}
    .tab.active{color:var(--orange);border-bottom-color:var(--orange)}

    .section{min-width:0;min-height:0}
    .section-card{height:100%;border-bottom:1px solid var(--border);background:#fff}
    .section-head{
      height:34px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      background:var(--orange-soft);
      border-bottom:1px solid #F1D4BF;
      font-size:12.5px;
      font-weight:700;
    }

    .member-details{padding:10px 14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;height:58px}
    .mini-field{min-width:0;overflow:hidden;padding:0 2px}
    .mini-field .label{font-size:10px;font-weight:500;color:#8B817C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
    .mini-field .value{font-size:12px;font-weight:700;color:#303030;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .assessment-section{display:grid;grid-template-rows:34px minmax(0,1fr);min-height:0}
    .assessment-grid{
      padding:10px 14px;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      grid-auto-rows:minmax(42px,1fr);
      column-gap:22px;
      row-gap:6px;
      overflow:hidden;
      align-content:stretch;
    }
    .kv{
      min-width:0;
      overflow:hidden;
      padding:2px 2px 4px;
      background:#fff;
    }
    .kv .k{font-size:10px;font-weight:500;color:#8B817C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
    .kv .v{font-size:11.5px;font-weight:700;color:#303030;display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:22px}
    .editable-value{
      width:100%;
      min-height:22px;
      padding:1px 0 3px;
      outline:none;
      border:none;
      border-bottom:1px solid #D7D0CC;
      background:transparent;
      font-size:11.5px;
      font-weight:700;
      color:#303030;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .editable-value:focus{border-bottom:2px solid var(--orange);padding-bottom:2px}

    .actions{display:flex;gap:6px}
    .btn{border:none;border-radius:6px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
    .btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-dark)}
    .btn-outline{background:#fff;color:var(--orange);border:1px solid var(--orange)}
    .btn-ghost{background:#fff;color:#555;border:1px solid #d8d8d8}

    .decision-section{display:grid;grid-template-rows:30px minmax(0,1fr)}
    .decision-head{display:flex;align-items:center;padding:0 12px;background:var(--orange-soft);font-size:12.5px;font-weight:700;border-top:1px solid #F1D4BF;border-bottom:1px solid #F1D4BF}
    .decision-content{display:grid;grid-template-columns:minmax(0,1fr) 180px 110px;gap:8px;padding:8px 10px;align-items:stretch}
    textarea,select{width:100%;height:100%;border:1px solid #D6D6D6;border-radius:7px;background:#fff;color:#30373d;font:inherit;padding:8px;outline:none}
    textarea{resize:none;font-size:11.5px;line-height:1.3}
    select{font-size:12px;font-weight:600}
    textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 2px #e45f1418}
    .submit-btn{height:100%;font-size:12px}

    .toast{position:fixed;right:18px;bottom:18px;transform:translateY(20px);opacity:0;pointer-events:none;background:#2f7d32;color:white;padding:10px 14px;border-radius:7px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}

    @media (max-width: 1100px){
      body{overflow:auto}
      .page{height:auto;overflow:auto}
      .panel{height:auto;grid-template-rows:44px 42px auto auto auto}
      .member-details{height:auto;grid-template-columns:repeat(3,minmax(0,1fr))}
      .assessment-grid{grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
    }
  </style>

      <section class="section decision-section">
        <div class="decision-head">Risk Decision</div>
        <div class="decision-content">
          <textarea id="riskRemark" aria-label="Risk Remark" placeholder="Risk Remark"></textarea>
          <select id="riskDecision" aria-label="Risk Decision">
            <option value="STD">STD</option>
            <option value="NON STD">NON STD</option>
          </select>
          <button class="btn btn-primary submit-btn" id="submitBtn">Submit</button>
        </div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
  const baseAssessment = [
    ['Name, address & stay confirmed','Yes'],['Standard of living','Good'],
    ['Life assured existence','Yes'],['Educational qualification','Graduate'],
    ['Contactability established','Yes'],['Occupation category','Salaried'],
    ['Computer applied for policy','Yes'],['Annual income','Between Rs 5 Lacs and 10 Lacs'],
    ['Met with whom','Self'],['Availability of LC at current address','Yes'],
    ['Hobbies','Non-smoker and non-alcoholic'],['Physical features','Healthy'],
    ['Previous medical history','No'],['Photo availability of life assured','Yes'],
    ['Vitality check','Positive'],['Geo tagging','Yes'],
    ['Type of house','Owned'],['Face match','Yes'],
    ['Investigation score','90'],['FE remarks','Investigation remarks to be mentioned here.']
  ].map((x,i)=>({id:'f'+i,label:x[0],value:x[1]}));

  const members = [
    {
      name:'Life Assured 1',
      details:[['KRN No','1316367'],['Application No','NB000021'],['Customer Name','Ravinder Ravinder'],['Vendor Name','The Credentials'],['Report Revised Date','2024-09-07 11:36:09']],
      assessment:structuredClone(baseAssessment),
      remark:'',decision:'STD'
    },
    {
      name:'Life Assured 2',
      details:[['KRN No','1316368'],['Application No','NB000022'],['Customer Name','Amit Sharma'],['Vendor Name','The Credentials'],['Report Revised Date','2024-09-08 09:15:42']],
      assessment:structuredClone(baseAssessment),
      remark:'',decision:'NON STD'
    },
    {
      name:'Proposer',
      details:[['KRN No','1316369'],['Application No','NB000023'],['Customer Name','Priya Singh'],['Vendor Name','The Credentials'],['Report Revised Date','2024-09-09 12:42:18']],
      assessment:structuredClone(baseAssessment),
      remark:'',decision:'STD'
    }
  ];

  let active = 0;
  let editing = false;
  let original = null;

  const tabs = document.getElementById('tabs');
  const details = document.getElementById('memberDetails');
  const grid = document.getElementById('assessmentGrid');
  const actions = document.getElementById('assessmentActions');
  const remark = document.getElementById('riskRemark');
  const decision = document.getElementById('riskDecision');
  const toast = document.getElementById('toast');

  function notify(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),2200);
  }

  function render(){
    const m = members[active];

    tabs.innerHTML = members.map((x,i)=>`<button class="tab ${i===active?'active':''}" onclick="switchMember(${i})">${x.name}</button>`).join('');

    details.innerHTML = m.details.map(([k,v])=>`<div class="mini-field"><div class="label">${k}</div><div class="value">${v}</div></div>`).join('');

    grid.innerHTML = m.assessment.map((r,i)=>`
      <div class="kv">
        <div class="k" title="${r.label}">${r.label}</div>
        <div class="v">${editing
          ? `<div class="editable-value" contenteditable="true" role="textbox" aria-label="${r.label}" oninput="updateAssessment(${i},this.textContent)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${String(r.value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`
          : `<span title="${r.value}">${r.value}</span>`}
        </div>
      </div>`).join('');

    actions.innerHTML = editing
      ? `<button class="btn btn-ghost" onclick="resetAssessment()">Reset</button><button class="btn btn-primary" onclick="saveAssessment()">Save</button>`
      : `<button class="btn btn-primary" onclick="startEdit()">Edit</button>`;

    remark.value = m.remark;
    decision.value = m.decision;
  }

  window.switchMember = function(index){
    active = index;
    editing = false;
    original = null;
    render();
  }

  window.startEdit = function(){
    original = structuredClone(members[active].assessment);
    editing = true;
    render();
  }

  window.updateAssessment = function(index,value){
    members[active].assessment[index].value = value;
  }

  window.resetAssessment = function(){
    if(original) members[active].assessment = structuredClone(original);
    editing = false;
    original = null;
    render();
    notify('Assessment reset successfully.');
  }

  window.saveAssessment = function(){
    editing = false;
    original = null;
    render();
    notify('Assessment saved successfully.');
  }

  remark.addEventListener('input',e=>members[active].remark=e.target.value);
  decision.addEventListener('change',e=>members[active].decision=e.target.value);
  document.getElementById('submitBtn').addEventListener('click',()=>notify(`${members[active].name} risk decision submitted.`));

  render();

  const backButton = document.querySelector('.header-back');
  if (backButton) {
    backButton.addEventListener('click', () => {
      window.location.href = './cuw-drs-read-only.html';
    });
  }

  const profileTrigger = document.getElementById('profile-trigger');
  const userMenu = document.getElementById('user-menu');
  const profileChevron = document.getElementById('profile-chevron');
  if (profileTrigger && userMenu) {
    profileTrigger.addEventListener('click', () => {
      const open = userMenu.classList.toggle('open');
      profileTrigger.setAttribute('aria-expanded', String(open));
      if (profileChevron) profileChevron.textContent = open ? '⌃' : '⌄';
    });
  }
  const currentTimeEl = document.getElementById('current-time');
  const sessionTimeEl = document.getElementById('session-time');
  if (currentTimeEl) {
    currentTimeEl.textContent = new Intl.DateTimeFormat('en-GB', {
      day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'
    }).format(new Date());
  }
</script>

  <script id="read-only-behavior">
    (() => {
      // Keep navigation, search, filters and viewing controls interactive.
      const viewingFields = '#medical-search, .medical-nav-search, #financial-search-input, #financial-search-field, [data-filter-value]';
      const actionSelectors = '#bre-refresh, #add-requirement, #save-requirements, [data-delete], #raise-grievance-submit, #grievance-confirm, #uw-submit, #uw-guideline-confirm, #counter-offer-save, #generate-referral, #email-reinsurers, [data-select-all], #submitBtn, #submit-financial, #submit-medical, #medical-decision-save, [data-review], button[data-edit], button[data-reset], button[data-save], [data-action="break"], #break-confirm';
      const actionWords = /^(agree|disagree|edit|save|reset|submit|confirm(?: & submit)?|add|delete|remove|retrigger|raise grievance)$/i;
      const values = new WeakMap();
      let observer;
      function refreshReadOnlyView() {
        observer?.disconnect();
        document.querySelectorAll('input, select, textarea').forEach(control => {
          if (control.matches(viewingFields) || control.type === 'hidden') return;
          let value = values.get(control);
          if (!value || !value.isConnected) {
            value = document.createElement('span');
            value.className = 'readonly-value';
            if (control.id) {
              value.id = control.id + '-value';
              const label = document.querySelector(`label[for="${control.id}"]`);
              if (label) { label.removeAttribute('for'); }
            }
            const name = control.getAttribute('aria-label');
            if (name) value.setAttribute('aria-label', name);
            control.after(value);
            values.set(control, value);
          }
          const display = control.tagName === 'SELECT'
            ? (control.value ? control.selectedOptions[0]?.textContent : '')
            : /^(checkbox|radio)$/.test(control.type) ? (control.checked ? 'Yes' : '—') : control.value;
          const text = String(display ?? '').trim() || '—';
          if (value.textContent !== text) value.textContent = text;
          control.classList.add('readonly-source');
          control.disabled = true;
          control.tabIndex = -1;
          control.setAttribute('aria-hidden', 'true');
          const trigger = value.nextElementSibling;
          if (trigger?.classList.contains('mui-select-trigger')) { trigger.classList.add('readonly-action'); trigger.disabled = true; }
        });
        document.querySelectorAll('button, [role="button"], a').forEach(button => {
          // Raise Grievance opens a view-only dialog; only its submit action is hidden.
          if (button.matches('[data-quick="Raise Grievance"]')) return;
          if (button.matches(actionSelectors) || actionWords.test(button.textContent.trim())) {
            button.classList.add('readonly-action');
            button.setAttribute('aria-disabled', 'true');
            if ('disabled' in button) button.disabled = true;
          }
        });
        document.querySelectorAll('.value[data-field]').forEach(field => {
          if (!field.textContent.trim()) field.textContent = '—';
        });
        document.querySelectorAll('[contenteditable="true"]').forEach(field => {
          field.contentEditable = 'false';
          field.removeAttribute('role');
          field.removeAttribute('tabindex');
        });
        observer?.observe(document.body, {childList: true, subtree: true});
      }
      ['click', 'beforeinput', 'input', 'change', 'submit'].forEach(type => {
        document.addEventListener(type, event => {
          if (type === 'submit' || event.target.closest('.readonly-source, .readonly-action')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      });
      observer = new MutationObserver(refreshReadOnlyView);
      refreshReadOnlyView();
    })();
  </script>
</body>
</html>
